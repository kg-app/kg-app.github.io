<style>

  button{font:inherit;color:inherit;cursor:pointer}

  .sitem:hover{background:var(--fill)}

  .main{padding:14px 18px 60px;overflow-x:auto}
  .crumb{display:flex;gap:4px;align-items:center;border-bottom:1px solid var(--ink);padding-bottom:7px;margin-bottom:12px;flex-wrap:wrap}

  .row{display:flex;gap:11px;flex-wrap:wrap}

  table{border-collapse:collapse;width:100%;font-size:11.5px}
  th,td{border:1px solid var(--hair);padding:4px 6px;text-align:left;vertical-align:top}

<script>
/* ===================== COST PIPELINE (reconciled to the live app) ===================== */
const FREIGHT=1.10, LANG_ADD=1.48199, INDIR=1.81401, PROJF=1.25, OWN_RATE=0.10;
const DISC_SPLIT=[['Piping',.40999],['Instrumentation & Controls',.34200],['Electrical',.22200],
 ['Structural Steel',.17800],['Concrete',.10500],['Painting',.07800],['Site Development',.05100],
 ['Equipment Installation',.04300],['Insulation',.02800],['Buildings',.02500]];
const IND_SPLIT=[['Labor Indirects & Field Costs',.62901],['Contractor Engineering & Fee',.81800],['Owner Engineering & Fee',.36700]];
const OWN_SPLIT=[["Owner's Costs",.050],['Start-Up & Commissioning',.030],['Capital Spares',.020]];

/* ===================== VALUE MODEL ===================== */
const HRS=8760, AVAIL=0.90, UTIL=0.85, ST_PER_T=1.10231;
const MARGIN=14.90;                 // $ downstream FCF per short ton delivered to the mill
const MILLCAP = tpd => tpd*365*ST_PER_T;
const MILL_UPLIFT_CAPEX = 38e6;     // downstream debottleneck, 15,000 → 20,000 tpd
const LIFE=20, DISC0=0.08;
const af=(d,n)=>(1-Math.pow(1+d,-n))/d;

/* ===================== EQUIPMENT ===================== */
const RECLAIM={
 fel:{label:'Front-end loader reclaim', opex:2.85e6,
      items:[{n:'Front-End Loader',p:3870808,owners:true}]},
 tun:{label:'Tunnel reclaim · 2 outlets', opex:0.95e6,
      items:[{n:'Front-End Loader (support)',p:1200000,owners:true},
             {n:'Tunnel Feeder A',p:312000},{n:'Tunnel Feeder B',p:312000}]},
 sr :{label:'Stacker–reclaimer', opex:0.62e6,
      items:[{n:'Radial Stacker',p:1950000},{n:'Bucket-Wheel Reclaimer',p:2400000}]}
};
function comps(c){
  const qf=Math.pow(c.q/1000,0.6), bf=Math.pow(c.bin/5,0.6);
  const r=RECLAIM[c.rec];
  const out=[{n:'ROM Stockpile',p:0,noncost:true}];
  r.items.forEach(i=>out.push({n:i.n,p:i.p*qf,owners:!!i.owners}));
  out.push({n:'Coarse Ore Bin',p:178468*qf*bf});
  out.push({n:'Choke-fed Apron Feeder',p:564192*qf});
  out.push({n:'Belt Conveyor',p:271820*qf});
  out.push({n:'Conical Stockpile',p:0,noncost:true});
  return out;
}
function tic(c){
  const k=comps(c);
  const lang=k.filter(x=>!x.noncost&&!x.owners).reduce((a,b)=>a+b.p,0);
  const own =k.filter(x=>x.owners).reduce((a,b)=>a+b.p,0);
  const tec =k.reduce((a,b)=>a+b.p,0);
  const cEquip=lang*FREIGHT, ownDeliv=own*FREIGHT;
  const direct=cEquip*(1+LANG_ADD), indirect=cEquip*INDIR;
  const cProject=(direct+indirect)*PROJF, ownRate=cProject*OWN_RATE;
  return {items:k, count:k.length, priced:k.filter(x=>!x.noncost).length,
          tec, cEquip, ownDeliv, direct, indirect, cProject, ownRate,
          ownersTotal:ownRate+ownDeliv, tic:cProject+ownRate+ownDeliv};
}
function value(c,mk){
  const T=tic(c), delivered=c.q*HRS*AVAIL*UTIL, cap=MILLCAP(c.mill);
  const fed=Math.min(delivered,cap);
  const gross=fed*MARGIN, opex=RECLAIM[c.rec].opex*(c.q/1000);
  const annual=gross-opex;
  const down=c.mill>15000?MILL_UPLIFT_CAPEX:0;
  const npv=annual*af(mk.disc,LIFE)-T.tic-down;
  return {...T, delivered, cap, fed, headroom:delivered-fed, gross, opexY:opex, annual, down, npv};
}
const M=v=>v/1e6, fM=v=>'$'+M(v).toFixed(2)+'M', fM0=v=>'$'+Math.round(M(v))+'M';
const $=v=>'$'+Math.round(v).toLocaleString();

/* ===================== SIZING (ROM stockpile, live) ===================== */
const AOR=37, BULK=100;
function sized(c){
  const days=10, Qtot=days*24*c.q;
  const R=Math.pow(Qtot*6000/(Math.PI*Math.tan(AOR*Math.PI/180)*BULK),1/3);
  const H=R*Math.tan(AOR*Math.PI/180);
  return {Qtot, R, H, Dpile:2*R, V:(1/3)*Math.PI*R*R*H, A:Math.PI*R*R,
    live1:0.17*Qtot, live2:0.249*Qtot, live3:0.265*Qtot, dead:Qtot-0.265*Qtot,
    tbuild:Qtot/c.q, tlive:0.265*Qtot/c.q, D:AOR+10, Ls:R+H/Math.sin(20*Math.PI/180),
    PH:H*BULK*0.70, binLive:c.bin, Whop:4.0, dmax:20};
}

/* ===================== CASES ===================== */
const seed=()=>[
 {id:'C-00',q:1000,rec:'fel',bin:5, mill:15000,delta:'base (frozen)',origin:'frozen',status:'frozen'},
 {id:'C-01',q:1000,rec:'tun',bin:5, mill:15000,delta:'Reclaim → tunnel, 2 outlets',origin:'generated',status:'ready'},
 {id:'C-02',q:1000,rec:'sr', bin:5, mill:15000,delta:'Reclaim → stacker–reclaimer',origin:'generated',status:'ready'},
 {id:'C-03',q:800, rec:'fel',bin:5, mill:15000,delta:'Throughput 800 stph (−20%)',origin:'generated',status:'ready'},
 {id:'C-04',q:1250,rec:'fel',bin:5, mill:15000,delta:'Throughput 1,250 stph (+25%)',origin:'generated',status:'ready'},
 {id:'C-05',q:1250,rec:'fel',bin:5, mill:20000,delta:'1,250 stph + mill debottleneck 20,000 tpd',origin:'generated',status:'ready'},
 {id:'C-06',q:1250,rec:'tun',bin:15,mill:20000,delta:'1,250 stph + tunnel + 15-min bin + mill 20,000',origin:'generated',status:'ready'},
 {id:'C-07',q:1250,rec:'sr', bin:15,mill:20000,delta:'1,250 stph + stacker–reclaimer + mill 20,000',origin:'generated',status:'ready'},
 {id:'C-08',q:1000,rec:'tun',bin:30,mill:15000,delta:'Tunnel reclaim + 30-min surge bin',origin:'generated',status:'ready'},
 {id:'C-09',q:1050,rec:'fel',bin:5, mill:15000,delta:'Throughput 1,050 stph (+5%)',origin:'generated',status:'degenerate',
   why:'Catalog selects the identical feeder, conveyor and bin. Finding: the installed circuit already passes 1,050 stph — and the mill only takes 900.6 stph, so 11% reclaim headroom is sitting unused.'},
 {id:'C-10',q:1250,rec:'tun',bin:5, mill:20000,delta:'1,250 stph tunnel, single outlet',origin:'generated',status:'infeasible',
   why:'Single outlet at 1,250 stph needs a hopper opening of 8.3 ft (bridging rule: 5 × d_max 20 in). Catalog maximum is 6.0 ft. Finding: any tunnel route above ~900 stph is committed to two or more outlets.'},
 {id:'C-11',q:1250,rec:'sr', bin:15,mill:20000,delta:'1,250 stph stacker–reclaimer @ 8% moisture',origin:'generated',status:'ready',
   willFail:'No stacker–reclaimer in catalog rev 2026.06 is rated above 6% moisture at 1,250 stph. Sizing flag 64 (gravity reclaim risk, moisture > 8%) is unresolved.'},
 {id:'C-12',q:1250,rec:'tun',bin:30,mill:20000,delta:'1,250 stph tunnel + 30-min surge + mill 20,000',origin:'manual',status:'ready',
   rationale:'Tunnel reclaim sized for the debottlenecked mill, with a 30-min surge bin so a mill trip does not stall the reclaim tunnel. — SM'}
];

const DESIGNS={
 oaat:{label:'One-at-a-time (OAAT)',cases:13,rsm:false,why:'Axial points only — no interior support and no interaction terms.'},
 ff  :{label:'Fractional factorial 2^(5-1)',cases:19,rsm:true,why:'Resolves main effects and 2-factor interactions. Supports a fitted surface.'},
 dopt:{label:'D-optimal (quadratic)',cases:31,rsm:true,why:'Maximises information per run; supports curvature and a fitted surface.'},
 full:{label:'Full factorial (3 levels)',cases:243,rsm:true,why:'Complete, but 19× the compute for little extra decision value at FEL-1.'}
};

/* ===================== STATE ===================== */
const FRESH=()=>({screen:'projects', baseTab:'sow', optTab:'sized', inspect:null,
 proj:{name:'Apron Feeder (2) LLM TEST 1',loc:'Silver Peak, Nevada · 5,000 ft',by:'S. Ramesh',
       created:'Jun 15, 2026',modified:'Jul 28, 2026'},
 objectives:[{k:'npv',label:'Maximise value of the delivered ore stream',w:40,on:true},
             {k:'capeff',label:'Capital efficiency (value per $ of TIC)',w:30,on:true},
             {k:'exec',label:'Execution risk (proven equipment route)',w:20,on:true},
             {k:'opex',label:'Minimise reclaim operating cost',w:10,on:true}],
 base:{econDone:false,frozen:false,note:'',cat:'2026.06',at:null},
 market:{disc:DISC0, margin:MARGIN},
 scope:{filled:{}}, screened:false, design:'oaat',
 cases:seed(), selected:['C-01','C-02','C-03','C-04','C-05','C-06','C-07','C-08','C-11','C-12'],
 runState:'idle', results:{}, rankBy:'npv', showBands:true, decision:null});
let S=load()||FRESH();
function save(){try{sessionStorage.setItem('av4',JSON.stringify(S))}catch(e){}}
function load(){try{const r=sessionStorage.getItem('av4');return r?JSON.parse(r):null}catch(e){return null}}
function resetAll(){S=FRESH();save();render()}
function set(f){f(S);save();render()}
function go(s){set(x=>x.screen=s);window.scrollTo(0,0)}
const C=id=>S.cases.find(c=>c.id===id);
const BASE=()=>S.cases[0];
function done(){return S.cases.filter(c=>S.results[c.id]&&!S.results[c.id].failed)}
function rows(){return done().map(c=>({c,v:value(c,S.market)}))}
function baseRow(){return {c:BASE(),v:value(BASE(),S.market)}}
function all(){return [...rows(), baseRow()]}
function score(r){
  const A=all(), nv=A.map(x=>x.v.npv), ce=A.map(x=>x.v.npv/x.v.tic), op=A.map(x=>-x.v.opexY);
  const nm=(v,a)=>Math.max(...a)===Math.min(...a)?1:(v-Math.min(...a))/(Math.max(...a)-Math.min(...a));
  const w=Object.fromEntries(S.objectives.map(o=>[o.k,o.on?o.w:0])), t=Object.values(w).reduce((a,b)=>a+b,0)||1;
  const exec=r.c.rec==='fel'?1:r.c.rec==='tun'?0.75:0.45;
  return 100*(w.npv*nm(r.v.npv,nv)+w.capeff*nm(r.v.npv/r.v.tic,ce)+w.exec*exec+w.opex*nm(-r.v.opexY,op))/t;
}
function ranked(){
  const A=all(), k=S.rankBy==='npv'?r=>r.v.npv:S.rankBy==='capeff'?r=>r.v.npv/r.v.tic:r=>score(r);
  return A.sort((a,b)=>k(b)-k(a));
}
const bandOf=r=>0.15*(r.v.tic+r.v.down);
function tiers(){const R=ranked(),o=[];let c=null;
  R.forEach(r=>{ if(!c||!(S.rankBy==='npv'&&r.v.npv>=c.lead.v.npv-(bandOf(c.lead)+bandOf(r)))){c={lead:r,rows:[r]};o.push(c)} else c.rows.push(r)});
  return o;}

/* ===================== SHARED TECHNICAL TABS ===================== */
function tabsBar(active,onclickPrefix,list){
  return `<div class="crumb">${list.map(([k,l],i)=>
    `<span class="${k===active?'on':'ok'}" onclick="${onclickPrefix}('${k}')">${l}</span>${i<list.length-1?'<i>›</i>':''}`).join('')}</div>`;
}
const TECH_TABS=[['sow','SoW Sources'],['ovw','System Overview'],['sized','Sized System'],['pfd','PFD'],
                 ['equip','Equipment Costs'],['tic','Total Installed Cost'],['val','Value & NPV']];
const OPT_TABS =[['sized','Sized System'],['pfd','PFD'],['equip','Equipment Costs'],['tic','Total Installed Cost'],['val','Value & NPV'],['delta','Delta vs base']];

function tSow(){return `<div class="box"><div class="boxhd">SoW source file · last processed 7/26/2026 9:35:46 AM</div>
  <table><thead><tr><th>Filename</th><th>Type</th><th class="num">Size</th><th>Updated</th><th class="num">Pages</th></tr></thead>
  <tbody><tr><td>1. Alpha-Val-SOW-1-simplified.pdf</td><td>PDF</td><td class="num">88.3 KB</td><td>Jun 15, 2026 08:02 PM</td><td class="num">2</td></tr></tbody></table>
  <div style="margin-top:8px"><button class="btn sm">Re-process SoW</button></div></div>`;}

function tOvw(c){const z=sized(c);return `<div class="row">
 <div class="col box"><div class="boxhd">System summary</div>
  <p>Dry bulk material handling circuit for run-of-mine copper ore, continuous operation at ${c.q.toLocaleString()} short tph (wet basis). Ore is reclaimed from a stockpile, fed to a bin, and transferred by apron feeder and belt conveyor to a conical stockpile ahead of the concentrator.</p>
  <b>Process description</b><p>ROM stockpile → ${c.rec==='fel'?'FEL':c.rec==='tun'?'tunnel feeders':'bucket-wheel reclaimer'} → ${c.bin}-min bin → choke-fed apron feeder → belt conveyor → conical stockpile</p>
  <b>Design basis</b><ul><li>Throughput ${c.q.toLocaleString()} short tph (wet)</li><li>Top size 20 in · P80 16 in</li>
  <li>Moisture 5% · PSD Rosin–Rammler</li><li>ROM stockpile 10 days (${Math.round(z.Qtot).toLocaleString()} st)</li><li>Bin ${c.bin} min live capacity</li></ul>
  <b>Material properties</b><ul><li>SG 2.75 · bulk density 100 lb/ft³ loose, 115 compacted</li><li>Angle of repose 37° · surcharge 20°</li><li>Abrasion index 0.18 · clay low–moderate</li></ul>
  <b>Operations</b><ul><li>24/7 · availability 90% · utilisation 85% · design factor 20%</li></ul>
  <b>Site conditions</b><ul><li>Nevada (Silver Peak) · elevation 5,000 ft</li></ul></div>
 <div class="col box"><div class="boxhd">SoW pre-flight</div>
  <p>Found: <span class="tag">throughput anchor</span> <span class="tag">Process Description</span> <span class="tag">Material Properties</span> <span class="tag">Operations</span> <span class="tag">Stockpiles / Storage</span> <span class="tag">Site Conditions</span> <span class="tag">Assumptions / Exclusions</span></p>
  <p>Not found in SoW: Design Basis · Mass Balance · Equipment List</p>
  <div class="boxhd" style="margin-top:12px">Material flow · <span class="tag">ok</span></div>
  <table><thead><tr><th>Equipment</th><th class="num">Q norm</th><th class="num">Q design</th></tr></thead><tbody>
  ${comps(c).map(k=>`<tr><td>${k.n}</td><td class="num">${c.q.toLocaleString()} stph</td><td class="num">${Math.round(c.q*1.2).toLocaleString()} stph</td></tr>`).join('')}
  </tbody></table>
  <div class="boxhd" style="margin-top:12px">Open questions</div>
  <ul><li>Exact belt speeds</li><li>Detailed PSD table</li><li>Layout geometry</li><li>Conveyor lengths / heights</li></ul></div></div>`;}

function tSized(c){const z=sized(c);
 const missing=[['Number of Reclaim Outlets','n_out','Capacity requirements'],['Continuous or Batch Reclaim','—','Capacity requirements'],
  ['Pile Foundation / Ground Conditions','—','Stockpile geometry'],['Drainage / Bunding','—','Stockpile geometry'],
  ['Stacker Type','—','Stockpile geometry'],['Reclaim Method','—','Reclaim system'],['Tunnel Feeder Type','—','Reclaim system']];
 const filled=k=>S.scope.filled[k];
 return `<div class="row">
 <div class="col box" style="max-width:220px;min-width:180px"><div class="boxhd">System components (${comps(c).length})</div>
  ${comps(c).map((k,i)=>`<div class="sitem ${i===0?'on':''}">${k.n}</div>`).join('')}
  <p><small>Schema 1.0.0 · sheet: ROM Stockpile</small></p></div>
 <div class="col box"><div class="boxhd">Material properties <span class="tag">6/6 R filled</span> &nbsp; Operational <span class="tag">3/3 R filled</span></div>

 </div>`;}

function tTic(c){const T=tic(c), pt=T.tic;
 const lo=pt*0.70, hi=pt*1.50, p10=pt*0.85, p90=pt*1.30;
 const X=v=>100*(v-lo)/(hi-lo);
 return `<div class="row">
  <div class="col box"><div class="boxhd">Cost build-up · TEC → Direct → Indirect → Project → Owner's</div>
   <table><tbody>
    <tr><td>C_equip (Lang-priced × ${FREIGHT} freight)</td><td class="num">${$(T.cEquip)}</td></tr>

    <tr><td>Owner's rate-based (${(OWN_RATE*100).toFixed(0)}% of C_project)</td><td class="num">${$(T.ownRate)}</td></tr>
    <tr><td>Owner's — owners-only equipment, delivered</td><td class="num">${$(T.ownDeliv)}</td></tr>
    <tr class="hl"><td><b>Total installed cost (TIC)</b></td><td class="num"><b>${$(T.tic)}</b></td></tr>

   <div class="boxhd" style="margin-top:11px">Stage — direct costs · Lang factor method</div>
   <table><tbody>${DISC_SPLIT.map(([n,f])=>`<tr><td>${n}</td><td style="width:45%"><div class="bar"><i style="width:${100*f/0.41}%"></i></div></td><td class="num">${$(T.cEquip*f)}</td></tr>`).join('')}
   <tr><td><b>Total direct cost</b></td><td></td><td class="num"><b>${$(T.direct)}</b></td></tr></tbody></table>
  </div>
  <div class="col box"><div class="boxhd">Accuracy band view · Class 5 (−30% / +50%)</div>
   <div style="font-size:22px;font-weight:700">${fM(pt)}</div>
   <div class="band" style="margin:10px 0">
     <div class="rng" style="left:0;width:100%"></div>
     <div class="rng" style="left:${X(p10)}%;width:${X(p90)-X(p10)}%;background:#cfcfcf"></div>
     <div class="pt" style="left:${X(pt)}%"></div>
   </div>
   <table><tbody>
    <tr><td>Point estimate</td><td class="num">${fM(pt)}</td></tr>
    <tr><td>Low (−30%)</td><td class="num">${fM(lo)}</td></tr>
    <tr><td>High (+50%)</td><td class="num">${fM(hi)}</td></tr>
    <tr><td>Spread</td><td class="num">${fM(hi-lo)} · ${Math.round(100*(hi-lo)/pt)}% of point</td></tr>
    <tr><td>Central 60% heuristic</td><td class="num">${fM(p10)} – ${fM(p90)}</td></tr>
   </tbody></table>

   <table><tbody>

   ${OWN_SPLIT.map(([n,f])=>`<tr><td>${n} (${(f*100).toFixed(0)}%)</td><td class="num">${$(T.cProject*f)}</td></tr>`).join('')}
   ${T.ownDeliv>0?`<tr><td>Owners-only equipment</td><td class="num">${$(T.ownDeliv)}</td></tr>`:''}
   <tr><td><b>Total owner's costs</b></td><td class="num"><b>${$(T.ownersTotal)}</b></td></tr></tbody></table>
  </div></div>`;}

function scRun(){
  const sel=S.cases.filter(c=>S.selected.includes(c.id)), st=S.runState, base=baseRow();
  const body=sel.map(c=>{const r=S.results[c.id];
    if(!r)return `<tr><td><b>${c.id}</b></td><td>${c.delta}</td><td colspan="7"><small>${st==='running'?'queued':'not evaluated'}</small></td></tr>`;
    if(r.failed)return `<tr><td><b>${c.id}</b></td><td>${c.delta}</td><td>✓</td><td>✗</td><td colspan="5"><span class="tag hatch">failed</span> ${r.failed}
      <div style="margin-top:3px"><button class="btn sm" onclick="fixFail()">Resolve →</button></div></td></tr>`;
    const v=value(c,S.market);
    return `<tr><td><b>${c.id}</b></td><td>${c.delta}</td><td>✓</td><td>✓</td>
      <td class="num">${v.count} <small>(${v.priced} priced)</small></td><td class="num">${fM(v.tec)}</td>
      <td class="num">${fM(v.tic)}${v.down?`<br><small>+${fM0(v.down)} mill</small>`:''}</td>
      <td class="num"><b>${fM0(v.npv)}</b><br><small>${v.npv>=base.v.npv?'+':'−'}${fM(Math.abs(v.npv-base.v.npv))}</small></td>
      <td><button class="btn sm" onclick="openOpt('${c.id}')">Details ▸</button></td></tr>`;}).join('');
  return crumbOpt('run')+`<h1>Evaluate</h1>
  <p class="sub">${sel.length} cases selected · sized → costed → valued · same case IDs throughout</p>
  ${st==='idle'?`<div class="box"><p>Nothing evaluated yet.</p><button class="btn pri" onclick="runAll()">Run ${sel.length} cases</button></div>`:`

   <table style="margin-top:9px"><thead><tr><th>Case</th><th>Delta vs C-00</th><th>Sized</th><th>Costed</th>
    <th class="num">Equipment</th><th class="num">Equipment cost (TEC)</th><th class="num">Capex (TIC)</th><th class="num">NPV</th><th></th></tr></thead>
   <tbody><tr class="hl"><td><b>C-00</b></td><td>base (frozen)</td><td>✓</td><td>✓</td>
    <td class="num">${base.v.count} <small>(${base.v.priced} priced)</small></td><td class="num">${fM(base.v.tec)}</td>
    <td class="num">${fM(base.v.tic)}</td><td class="num"><b>${fM0(base.v.npv)}</b><br><small>base</small></td>
    <td><button class="btn sm" onclick="openOpt('C-00')">Details ▸</button></td></tr>${body}</tbody></table>
   <p><small>Completed rows are inspectable while the batch runs. One failed match isolates to its row and never voids the run.</small></p>
   <div class="note"><b>NOTE ·</b> Equipment count and equipment cost sit next to capex because they are what actually moves between options — the tunnel route adds two feeders and $624k of equipment but removes $2.67M of loader, and none of that is visible from TIC alone.</div>
   ${st==='done'?`<button class="btn pri" onclick="go('compare')">Compare ${done().length} results →</button>`:''}</div>
  <div class="box gray"><div class="boxhd">Design-space coverage</div><div class="row">
   <div style="min-width:420px"><div class="grid3">
    <div class="cell hd"></div><div class="cell hd">3% moist</div><div class="cell hd">5% moist</div><div class="cell hd">8% moist</div>
    <div class="cell hd">FEL</div><div class="cell ok">✓</div><div class="cell ok">✓</div><div class="cell none">—</div>
    <div class="cell hd">Tunnel</div><div class="cell ok">✓</div><div class="cell ok">✓</div><div class="cell none">—</div>
    <div class="cell hd">Stkr-rec</div><div class="cell ok">✓</div><div class="cell ok">✓</div><div class="cell fail">✗</div>
   </div><p><small>Hatched = failed. Blank = not in the selected design.</small></p></div>
   <div class="col"><p><b>The wet-season corner is uncovered for the stacker–reclaimer route.</b> C-11 failed on a catalog gap, not a transient error, so no 8%-moisture case survives on the route with the lowest operating cost.</p>
   <p>Sizing flag 64 (gravity reclaim risk above 8% moisture) is exactly the condition that would decide between FEL and mechanical reclaim in a wet season. Conclusions are dry-season only until this is resolved.</p></div></div>
   <div class="note"><b>NOTE ·</b> The live app offers "Retry" on failures that can never succeed on retry, and gives no indication that a whole region of the space has gone missing.</div></div>`}`;}

function runAll(){set(s=>{s.runState='running';s.results={}});

function deltaView(c,v,b,B){
  const kb=comps(BASE()), kc=comps(c);
  const names=[...new Set([...kb.map(x=>x.n),...kc.map(x=>x.n)])];
  const get=(arr,n)=>arr.find(x=>x.n===n);
  return `<div class="box"><div class="boxhd">Equipment delta vs C-00</div>
   <table><thead><tr><th>Component</th><th class="num">Base cost</th><th class="num">${c.id} cost</th><th class="num">Δ</th><th>Change</th></tr></thead><tbody>
   ${names.map(n=>{const a=get(kb,n),d=get(kc,n);
     const ap=a?a.p:0,dp=d?d.p:0;
     const lab=!a?'<span class="tag">added</span>':!d?'<span class="tag hatch">removed</span>':Math.abs(ap-dp)<1?'unchanged':'rescaled';
     return `<tr class="${!a||!d?'hl':''}"><td>${n}</td><td class="num">${a?(a.noncost?'—':$(ap)):'—'}</td>
      <td class="num">${d?(d.noncost?'—':$(dp)):'—'}</td>
      <td class="num">${(!a||!d||a.noncost)?'—':(dp-ap>=0?'+':'−')+$(Math.abs(dp-ap))}</td><td>${lab}</td></tr>`}).join('')}
   <tr><td><b>TEC</b></td><td class="num"><b>${fM(B.tec)}</b></td><td class="num"><b>${fM(v.tec)}</b></td><td class="num"><b>${v.tec>=B.tec?'+':'−'}${fM(Math.abs(v.tec-B.tec))}</b></td><td></td></tr>
   <tr><td><b>TIC</b></td><td class="num"><b>${fM(B.tic)}</b></td><td class="num"><b>${fM(v.tic)}</b></td><td class="num"><b>${v.tic>=B.tic?'+':'−'}${fM(Math.abs(v.tic-B.tic))}</b></td><td></td></tr>
   </tbody></table></div>
   <div class="box gray"><div class="boxhd">Where the value comes from</div>
   <table><tbody>
    <tr><td>PV of change in reclaim operating cost</td><td class="num">${(b.v.opexY-v.opexY)>=0?'+':'−'}${fM(Math.abs((b.v.opexY-v.opexY)*af(S.market.disc,LIFE)))}</td></tr>
    <tr><td>PV of change in ore fed to the mill</td><td class="num">${(v.fed-b.v.fed)>=0?'+':'−'}${fM(Math.abs((v.fed-b.v.fed)*MARGIN*af(S.market.disc,LIFE)))}</td></tr>
    <tr><td>Change in circuit TIC</td><td class="num">${(B.tic-v.tic)>=0?'+':'−'}${fM(Math.abs(v.tic-B.tic))}</td></tr>
    ${v.down?`<tr><td>Downstream mill debottleneck</td><td class="num">−${fM(v.down)}</td></tr>`:''}
    <tr class="hl"><td><b>Net vs base</b></td><td class="num"><b>${(v.npv-b.v.npv)>=0?'+':'−'}${fM(Math.abs(v.npv-b.v.npv))}</b></td></tr>
   </tbody></table>
   <div class="note"><b>NOTE ·</b> This decomposition is the answer to "why is this option better", and it is the thing no spreadsheet comparison of two TIC totals can give you.</div></div>`;}

/* ---------- compare ---------- */
function scCompare(){
  if(!done().length)return crumbOpt('compare')+'<div class="box"><p>No results yet.</p><button class="btn pri" onclick="go(\'run\')">Go to evaluate →</button></div>';
  const R=ranked(), b=baseRow(), T=tiers();
  const mx=Math.max(...R.map(r=>r.v.npv)), mn=Math.min(...R.map(r=>r.v.npv));
  const lo=mn-60e6, hi=mx+60e6, sp=hi-lo, X=v=>100*(v-lo)/sp;
  const noMill=R.filter(r=>!r.v.down), bestNo=noMill[0];
  const bars=T.map((t,i)=>`<tr><td colspan="4" style="border:none;padding-top:9px"><b>Tier ${i+1}</b>
    <small> — ${t.rows.length} option${t.rows.length>1?'s':''}${t.rows.length>1?', not separable at Class 5 accuracy':''}${t.rows[0].v.down?' · requires the $38M mill debottleneck':''}</small></td></tr>
   ${t.rows.map(r=>`<tr><td style="white-space:nowrap"><b>${r.c.id}</b>${r.c.origin==='manual'?' <span class="tag">manual</span>':''}${r.c.id==='C-00'?' <span class="tag solid">base</span>':''}</td>
    <td><small>${r.c.q.toLocaleString()} stph · ${{fel:'FEL',tun:'Tunnel',sr:'Stkr-rec'}[r.c.rec]} · ${r.c.bin}m · mill ${r.c.mill/1000}k</small></td>
    <td style="width:44%"><div class="band">${S.showBands?`<div class="rng" style="left:${X(r.v.npv-bandOf(r))}%;width:${100*2*bandOf(r)/sp}%"></div>`:''}
     <div class="pt" style="left:${X(r.v.npv)}%"></div><div class="pt" style="left:${X(b.v.npv)}%;background:#aaa"></div></div></td>
    <td class="num" style="white-space:nowrap"><b>${fM0(r.v.npv)}</b><br><small>${r.c.id==='C-00'?'base':(r.v.npv>=b.v.npv?'+':'−')+fM(Math.abs(r.v.npv-b.v.npv))}</small></td></tr>`).join('')}`).join('');

  return crumbOpt('compare')+`<h1>Compare &amp; decide</h1>
  <p class="sub">${R.length} options on one basis · frozen technical basis, live market assumptions</p>
  <div class="row" style="margin-bottom:11px">
   <div class="kpi"><span>NPV SPREAD</span><b>${fM0(mx-mn)}</b><small>what the choice is worth</small></div>
   <div class="kpi"><span>BEST OVERALL</span><b>+${fM0(mx-b.v.npv)}</b><small>${R[0].c.id} · needs mill decision</small></div>
   <div class="kpi"><span>BEST CIRCUIT-ONLY</span><b>+${fM(bestNo.v.npv-b.v.npv)}</b><small>${bestNo.c.id} · circuit team can act alone</small></div>
   <div class="kpi"><span>TIER 1 SIZE</span><b>${T[0].rows.length}</b><small>tied at Class 5</small></div></div>

  <div class="box"><div class="boxhd">Live assumptions — applied to every option including the base</div><div class="row">
   <div class="col"><label class="f">DISCOUNT RATE ${(S.market.disc*100).toFixed(1)}%</label>
    <input type="range" min="0.05" max="0.14" step="0.005" value="${S.market.disc}" oninput="S.market.disc=+this.value;save();render()"></div>
   <div class="col" style="display:flex;align-items:flex-end"><button class="btn sm" onclick="set(s=>s.market.disc=${DISC0})">Reset to base assumptions</button></div></div></div>

  <div class="box"><div class="boxhd">Ranking · grouped into tiers by estimate accuracy
   <span style="float:right"><label><input type="checkbox" style="width:auto" ${S.showBands?'checked':''} onchange="set(s=>s.showBands=this.checked)"> accuracy bands</label></span></div>
   <table><tbody>${bars}</tbody></table>
   <p><small>Bar = point estimate. Hatched span = ±15% differential capital uncertainty, well inside a Class 5 band. Grey line = frozen base.</small></p>
   <div class="note"><b>NOTE ·</b> Two decisions are stacked here and the tiers keep them apart. Whether to debottleneck the mill is worth ~${fM0(mx-bestNo.v.npv)} and is not the circuit team's call. Within the circuit alone, the reclaim route is worth ${fM(bestNo.v.npv-b.v.npv)} — and that one is available now.</div></div>

  <div class="box"><div class="boxhd">All options
   <span style="float:right">rank by: <select style="width:auto" onchange="set(s=>s.rankBy=this.value)">
    <option value="npv" ${S.rankBy==='npv'?'selected':''}>NPV</option>
    <option value="capeff" ${S.rankBy==='capeff'?'selected':''}>Value per $ of TIC</option>
    <option value="score" ${S.rankBy==='score'?'selected':''}>Weighted objectives</option></select></span></div>
   <table><thead><tr><th>Case</th><th>Reclaim route</th><th class="num">stph</th><th class="num">Equip</th>
    <th class="num">Equip cost (TEC)</th><th class="num">Capex (TIC)</th><th class="num">Reclaim OpEx/yr</th>
    <th class="num">NPV</th><th class="num">NPV / TIC</th><th class="num">Score</th><th></th></tr></thead><tbody>
   ${R.map(r=>`<tr class="${r.c.id==='C-00'?'hl':''}"><td><b>${r.c.id}</b></td><td>${RECLAIM[r.c.rec].label}</td>
    <td class="num">${r.c.q.toLocaleString()}</td><td class="num">${r.v.count}</td><td class="num">${fM(r.v.tec)}</td>
    <td class="num">${fM(r.v.tic)}${r.v.down?`<br><small>+${fM0(r.v.down)} mill</small>`:''}</td>
    <td class="num">${fM(r.v.opexY)}</td><td class="num"><b>${fM0(r.v.npv)}</b></td>
    <td class="num">${(r.v.npv/r.v.tic).toFixed(0)}×</td><td class="num">${score(r).toFixed(0)}</td>
    <td><button class="btn sm" onclick="openOpt('${r.c.id}')">Details ▸</button></td></tr>`).join('')}
   </tbody></table>
   <div class="note"><b>NOTE ·</b> Equipment count, equipment cost and operating cost sit alongside capex because the central trade in this circuit is capital against reclaim labour. C-01 spends ${fM(tic(C('C-01')).tic-tic(BASE()).tic)} more capital to remove ${fM(RECLAIM.fel.opex-RECLAIM.tun.opex)} a year of loader operation — invisible from a TIC column alone.</div></div>

  <div class="box gray"><div class="boxhd">What a 2–3 option study would have missed</div>
   <table><thead><tr><th>If the team had only run…</th><th class="num">Best NPV found</th><th class="num">Value left on the table</th></tr></thead><tbody>
    ${[['Base case only',[b]],['Base + throughput sensitivity (C-03, C-04)',[b,...R.filter(r=>['C-03','C-04'].includes(r.c.id))]],
       ['Base + throughput + one reclaim swap (C-01)',[b,...R.filter(r=>['C-03','C-04','C-01'].includes(r.c.id))]],
       [`All ${R.length} options (this study)`,R]].map(([lab,set_],i)=>{
      const best=Math.max(...set_.map(r=>r.v.npv));
      return `<tr class="${i===3?'hl':''}"><td>${lab}</td><td class="num">${fM0(best)}</td><td class="num">${i===3?'—':fM0(mx-best)}</td></tr>`}).join('')}
   </tbody></table>
   <div class="note"><b>NOTE ·</b> This is the product thesis as arithmetic, and the slide that justifies the study budget.</div></div>
  <button class="btn pri" onclick="go('decision')">Record the decision →</button>`;}

function scDecision(){
  const R=ranked(),T=tiers(),b=baseRow(),noMill=R.filter(r=>!r.v.down),bn=noMill[0];
  return `<h1>Decision record</h1><p class="sub">Assembled from the study. Editable, exportable, and the audit trail for the gate review.</p>
  <div class="box"><div class="boxhd">Claims</div><ul>
   <li>The reclaim method was never stated in the scope of work. The frozen base case assumed a front-end loader and costed ${fM(3870808*1.1)} of owners-only equipment against that unrecorded assumption.</li>
   <li>Changing the reclaim route alone — no change to throughput, no downstream decision — is worth ${fM(bn.v.npv-b.v.npv)} (${bn.c.id}).</li>
   <li>Circuit reclaim capacity exceeds mill intake by 11% at the base rate. The mill takes 900.6 stph; the circuit passes 1,000 and the same equipment passes 1,050 (C-09).</li>
   <li>Throughput above ~900 stph returns nothing unless the mill ceiling moves — C-04 spends capital for zero additional ore fed.</li></ul></div>
  <div class="box"><div class="boxhd">Evidence</div><ul>
   <li>${R.length} options evaluated on one frozen technical basis, catalog rev ${S.base.cat}, one cost pipeline (C_equip → Lang ${(1+LANG_ADD).toFixed(2)}× → indirect → project → owner's).</li>
   <li>Screening: 5 of 44 schema parameters above the $1M sensitivity cut.</li>
   <li>Base case frozen ${S.base.at||'—'}. Rationale: ${S.base.note||'—'}</li></ul></div>
  <div class="box"><div class="boxhd">Tensions</div><ul>
   <li>The stacker–reclaimer has the lowest operating cost and the highest capital; at an 8% discount rate the two roughly cancel, so the choice is a view on discount rate, not on engineering.</li>
   <li>Tier 1 mixes a circuit decision with a $38M downstream mill decision the circuit team does not own.</li>
   <li>Tunnel civils are carried as a Lang-factored allowance, not a costed excavation. That is the weakest number supporting the highest circuit-only value.</li></ul></div>
  <div class="box"><div class="boxhd">Counterfactuals &amp; gaps</div><ul>
   <li>Reclaim Method, Tunnel Feeder Type and Number of Reclaim Outlets were supplied as assumptions, not measured or specified. All reclaim options inherit them.</li>
   <li>The 8%-moisture corner is uncovered for the stacker–reclaimer route (C-11 failed on a catalog gap). Conclusions are dry-season only.</li>
   <li>Had only 2–3 options been run, up to ${fM0(R[0].v.npv-b.v.npv)} would not have been seen.</li></ul></div>
  <div class="box"><div class="boxhd">Commit</div><p>Carry forward to FEL-2:</p>
   <div style="display:flex;gap:7px;flex-wrap:wrap">
    ${T[0].rows.map(r=>`<button class="btn" onclick="set(s=>s.decision='${r.c.id} — ${r.c.delta.replace(/'/g,'')}')">${r.c.id}</button>`).join('')}
    <button class="btn" onclick="set(s=>s.decision='Split: commit the reclaim route change now (${bn.c.id}); refer the mill debottleneck to the concentrator gate')">Split the decision</button></div>
   ${S.decision?`<p style="margin-top:9px"><b>Committed:</b> ${S.decision}</p>`:''}
   <div class="note"><b>NOTE ·</b> "Split the decision" is the honest FEL-1 outcome here and no single-winner ranking can express it: one change is inside the circuit team's authority and available now, the other belongs to a different gate.</div></div>
  <button class="btn pri" onclick="go('landing')">Back to project</button>`;}

/* ===================== RENDER ===================== */
const SC={projects:scProjects,landing:scLanding,basecase:scBase,scope:scScope,matrix:scMatrix,
 run:scRun,compare:scCompare,inspect:scInspect,decision:scDecision};
function render(){
  document.getElementById('app').innerHTML=sidebar()+'<div class="main">'+(SC[S.screen]||scProjects)()+'</div>';
  document.body.classList.toggle('notes-off',!document.getElementById('noteToggle').checked);
}
document.getElementById('noteToggle').addEventListener('change',render);
render();
</script>
