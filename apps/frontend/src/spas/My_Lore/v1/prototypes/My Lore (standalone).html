document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

border-radius:8px;display:flex;align-items:center;justify-content:center;color:oklch(55% 0.02 60);cursor:pointer;font-size:17px;\">×<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"font-size:12.5px;font-weight:600;color:oklch(38% 0.02 60);margin-bottom:6px;\">Who is this for<\u002Fdiv>\n        <div style=\"display:flex;gap:6px;margin-bottom:14px;\">\n          <sc-for list=\"{{ formKidChips }}\" as=\"c\" hint-placeholder-count=\"2\">\n            <div sc-camel-on-click=\"{{ c.onClick }}\" style=\"flex:1;text-align:center;padding:8px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;background:{{ c.bg }};color:{{ c.text }};border:1.5px solid {{ c.border }};\">{{ c.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"font-size:12.5px;font-weight:600;color:oklch(38% 0.02 60);margin-bottom:6px;\">Category<\u002Fdiv>\n        <div style=\"display:flex;gap:6px;margin-bottom:14px;\">\n          <sc-for list=\"{{ formCatChips }}\" as=\"c\" hint-placeholder-count=\"3\">\n            <div sc-camel-on-click=\"{{ c.onClick }}\" style=\"flex:1;text-align:center;padding:8px 4px;border-radius:10px;font-size:12.5px;font-weight:700;cursor:pointer;background:{{ c.bg }};color:{{ c.text }};border:1.5px solid {{ c.border }};\">{{ c.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:10px;margin-bottom:12px;\">\n          <input value=\"{{ newEntry.title }}\" sc-camel-on-change=\"{{ onFieldTitle }}\" placeholder=\"Title\" style=\"flex:2;padding:10px 12px;border-radius:10px;border:1px solid oklch(89% 0.012 70);font-size:13.5px;font-family:'Inter',sans-serif;outline:none;\">\n          <input value=\"{{ newEntry.date }}\" sc-camel-on-change=\"{{ onFieldDate }}\" type=\"date\" style=\"flex:1;padding:10px 12px;border-radius:10px;border:1px solid oklch(89% 0.012 70);font-size:13.5px;font-family:'Inter',sans-serif;outline:none;\">\n        <\u002Fdiv>\n        <textarea value=\"{{ newEntry.description }}\" sc-camel-on-change=\"{{ onFieldDesc }}\" placeholder=\"What happened?\" style=\"width:100%;min-height:70px;padding:10px 12px;border-radius:10px;border:1px solid oklch(89% 0.012 70);font-size:13.5px;font-family:'Inter',sans-serif;outline:none;resize:none;margin-bottom:12px;\"><\u002Ftextarea>\n        <input value=\"{{ newEntry.tags }}\" sc-camel-on-change=\"{{ onFieldTags }}\" placeholder=\"Tags, comma separated\" style=\"width:100%;padding:10px 12px;border-radius:10px;border:1px solid oklch(89% 0.012 70);font-size:13.5px;font-family:'Inter',sans-serif;outline:none;margin-bottom:16px;\">\n        <div style=\"border:1.5px dashed oklch(85% 0.015 60);border-radius:12px;padding:16px;text-align:center;font-size:12px;color:oklch(58% 0.02 60);margin-bottom:16px;\">Drop a photo here (optional)<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ submitEntry }}\" style=\"text-align:center;padding:13px;border-radius:12px;background:oklch(30% 0.05 300);color:white;font-weight:700;font-size:14px;cursor:pointer;\">Save entry<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- BULK IMPORT MODAL -->\n  <sc-if value=\"{{ bulkOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeModals }}\" style=\"position:fixed;inset:0;background:oklch(20% 0.01 60 / 0.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width:100%;max-width:460px;background:oklch(99% 0.004 70);border-radius:20px 20px 0 0;padding:20px 18px 24px;max-height:85vh;overflow-y:auto;animation:sheetUp .22s ease-out;\">\n        <div style=\"width:36px;height:4px;border-radius:3px;background:oklch(88% 0.01 60);margin:0 auto 14px;\"><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;\">\n          <div style=\"font-family:'Baloo 2',sans-serif;font-weight:700;font-size:18px;color:oklch(24% 0.02 60);\">Bulk import<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ closeModals }}\" style=\"width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:oklch(55% 0.02 60);cursor:pointer;font-size:17px;\">×<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px;font-weight:600;color:oklch(38% 0.02 60);margin-bottom:6px;\">Who is this for<\u002Fdiv>\n        <div style=\"display:flex;gap:6px;margin-bottom:14px;\">\n          <sc-for list=\"{{ formKidChips }}\" as=\"c\" hint-placeholder-count=\"2\">\n            <div sc-camel-on-click=\"{{ c.onClick }}\" style=\"flex:1;text-align:center;padding:8px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;background:{{ c.bg }};color:{{ c.text }};border:1.5px solid {{ c.border }};\">{{ c.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px;font-weight:600;color:oklch(38% 0.02 60);margin-bottom:4px;\">Events (one per line)<\u002Fdiv>\n        <div style=\"font-size:11px;color:oklch(58% 0.02 60);margin-bottom:8px;line-height:1.5;\">Format: date, title, category, description, tags. Category is achievement / milestone / learning.<\u002Fdiv>\n        <textarea value=\"{{ bulkText }}\" sc-camel-on-change=\"{{ onBulkText }}\" style=\"width:100%;min-height:130px;padding:10px 12px;border-radius:10px;border:1px solid oklch(89% 0.012 70);font-size:12.5px;font-family:'Inter',sans-serif;outline:none;margin-bottom:16px;\"><\u002Ftextarea>\n        <div sc-camel-on-click=\"{{ submitBulk }}\" style=\"text-align:center;padding:13px;border-radius:12px;background:oklch(30% 0.05 300);color:white;font-weight:700;font-size:14px;cursor:pointer;\">Import entries<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ADD CHILD MODAL -->\n  <sc-if value=\"{{ addChildOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeModals }}\" style=\"position:fixed;inset:0;background:oklch(20% 0.01 60 / 0.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width:100%;max-width:340px;background:oklch(99% 0.004 70);border-radius:18px;padding:22px;animation:popIn .18s ease-out;\">\n        <div style=\"font-family:'Baloo 2',sans-serif;font-weight:700;font-size:17px;color:oklch(24% 0.02 60);margin-bottom:14px;\">Add a child<\u002Fdiv>\n        <input value=\"{{ newChildName }}\" sc-camel-on-change=\"{{ onChildName }}\" placeholder=\"Child's name\" style=\"width:100%;padding:11px 13px;border-radius:10px;border:1px solid oklch(89% 0.012 70);font-size:14px;font-family:'Inter',sans-serif;outline:none;margin-bottom:16px;\">\n        <div style=\"display:flex;gap:8px;\">\n          <div sc-camel-on-click=\"{{ closeModals }}\" style=\"flex:1;text-align:center;padding:11px;border-radius:10px;background:oklch(94% 0.008 70);color:oklch(38% 0.02 60);font-weight:600;font-size:13.5px;cursor:pointer;\">Cancel<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ submitChild }}\" style=\"flex:1;text-align:center;padding:11px;border-radius:10px;background:oklch(30% 0.05 300);color:white;font-weight:700;font-size:13.5px;cursor:pointer;\">Add<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<div style=\"width: 457px; max-width: 460px; background: oklch(99% 0.004 70 / 0.96); backdrop-filter: blur(8px); border-top: 1px solid oklch(91% 0.012 70); display: flex; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); position: absolute; left: -1px; top: 824px; height: 83px\">\n      <sc-for list=\"{{ navTabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n        <div sc-camel-on-click=\"{{ t.onClick }}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;cursor:pointer;\">\n          <div style=\"width:20px;height:20px;display:flex;align-items:center;justify-content:center;\">\n            <div style=\"width:16px;height:16px;border-radius:5px;background:{{ t.iconColor }};opacity:{{ t.iconOpacity }};\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:11px;font-weight:700;color:{{ t.color }};font-family:'Baloo 2',sans-serif;\">{{ t.label }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <div sc-camel-on-click=\"{{ openAddEntry }}\" style=\"position: fixed; width: 56px; height: 56px; border-radius: 50%; background: oklch(30% 0.05 300); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 20px oklch(30% 0.05 300 / 0.4); animation: fabPulse 3s ease-in-out infinite; z-index: 15; left: 403px; top: 10px\">\n    <div style=\"position:relative;width:18px;height:18px;\">\n      <div style=\"position:absolute;top:8px;left:0;width:18px;height:2.5px;background:white;border-radius:2px;\"><\u002Fdiv>\n      <div style=\"position:absolute;top:0;left:8px;width:2.5px;height:18px;background:white;border-radius:2px;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst CATS = {\n  achievement: { label: 'Achievement', color: 'oklch(58% 0.16 55)', soft: 'oklch(94% 0.045 65)' },\n  milestone: { label: 'Milestone', color: 'oklch(50% 0.15 255)', soft: 'oklch(94% 0.03 255)' },\n  learning: { label: 'Learning', color: 'oklch(52% 0.18 20)', soft: 'oklch(94% 0.04 20)' },\n};\nconst KIDS_META = {\n  nayna: { name: 'Nayna', color: 'oklch(45% 0.10 175)', soft: 'oklch(92% 0.045 175)' },\n  nishka: { name: 'Nishka', color: 'oklch(42% 0.14 310)', soft: 'oklch(92% 0.045 310)' },\n};\nconst MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n\nfunction fmtDate(iso){\n  const d = new Date(iso + 'T00:00:00');\n  return MONTHS[d.getMonth()] + ' ' + d.getDate();\n}\n\nclass Component extends DCLogic {\n  state = {\n    screen: 'timeline',\n    search: '',\n    kidFilter: 'both',\n    catFilter: 'all',\n    kids: [ { id:'nayna', name:'Nayna' }, { id:'nishka', name:'Nishka' } ],\n    entries: [\n      { id:1, title:'Volleyball Nationals (14u)', date:'2026-06-25', kid:'nishka', category:'achievement', description:'Participated in Nationals Volleyball championship at Indianapolis, IN', tags:['volleyball'] },\n      { id:2, title:'Middle School Graduation', date:'2026-06-12', kid:'nishka', category:'milestone', description:'Graduated from Middle School from Martin Middle Gifted-Talented School; high grades', tags:['school'] },\n      { id:3, title:'Graduated from Martin Middle School', date:'2026-06-11', kid:'nishka', category:'milestone', description:'Achieved grades of 5, 4, and 3 in Math, Science, and ELA. Based on self-work', tags:['school','academics','graduation'] },\n      { id:4, title:'Graduated from elementary school', date:'2026-06-10', kid:'nayna', category:'milestone', description:\"Received the 'Emerging Leader' award for her class section, one of 4 kids recognized\", tags:['school','graduation','award'] },\n      { id:5, title:'Finished Kathak Level 2', date:'2026-06-09', kid:'nayna', category:'milestone', description:'Graduated from level 2 in Kathak at Kriti dance academy, Morrisville, NC', tags:['dance'] },\n      { id:6, title:'Completed first club volleyball season', date:'2026-02-28', kid:'nayna', category:'achievement', description:'Wrapped up the season with a win at the final tournament', tags:['volleyball','club','tournament'] },\n      { id:7, title:'School volleyball team — back-to-back champions', date:'2025-11-20', kid:'nayna', category:'achievement', description:'Won the conference title for the second year running', tags:['volleyball','school'] },\n      { id:8, title:'Learned freestyle swimming', date:'2025-07-04', kid:'nayna', category:'learning', description:'Completed a summer swim course and can now swim freestyle laps', tags:['swimming'] },\n      { id:9, title:'Started Kathak Level 1', date:'2025-03-15', kid:'nishka', category:'learning', description:'Began classical dance training at Kriti dance academy', tags:['dance'] },\n    ],\n    addEntryOpen: false, bulkOpen: false, addChildOpen: false,\n    newEntry: { title:'', date:'', kid:'nayna', category:'achievement', description:'', tags:'' },\n    newChildName: '',\n    shareEmail: '', shareScope: 'both', canEdit: false,\n    bulkText: '', bulkKid: 'nayna',\n  };\n\n  setScreen(s){ this.setState({ screen: s }); }\n  onSearch = (e) => this.setState({ search: e.target.value });\n  setKidFilter(id){ this.setState({ kidFilter: id }); }\n  setCatFilter(id){ this.setState({ catFilter: id }); }\n  openAddEntry = () => this.setState({ addEntryOpen: true });\n  openBulk = () => this.setState({ bulkOpen: true });\n  openAddChild = () => this.setState({ addChildOpen: true });\n  closeModals = () => this.setState({ addEntryOpen:false, bulkOpen:false, addChildOpen:false });\n  stop = (e) => e.stopPropagation();\n\n  onFieldTitle = (e) => this.setState(s => ({ newEntry: { ...s.newEntry, title: e.target.value } }));\n  onFieldDate = (e) => this.setState(s => ({ newEntry: { ...s.newEntry, date: e.target.value } }));\n  onFieldDesc = (e) => this.setState(s => ({ newEntry: { ...s.newEntry, description: e.target.value } }));\n  onFieldTags = (e) => this.setState(s => ({ newEntry: { ...s.newEntry, tags: e.target.value } }));\n  setFormKid(id){ this.setState(s => ({ newEntry: { ...s.newEntry, kid: id } })); }\n  setFormCat(id){ this.setState(s => ({ newEntry: { ...s.newEntry, category: id } })); }\n\n  submitEntry = () => {\n    const ne = this.state.newEntry;\n    if (!ne.title || !ne.date) return;\n    const tags = ne.tags.split(',').map(t => t.trim()).filter(Boolean);\n    this.setState(s => ({\n      entries: [...s.entries, { id: Date.now(), title: ne.title, date: ne.date, kid: ne.kid, category: ne.category, description: ne.description, tags }],\n      addEntryOpen: false,\n      newEntry: { title:'', date:'', kid:'nayna', category:'achievement', description:'', tags:'' },\n    }));\n  };\n\n  onChildName = (e) => this.setState({ newChildName: e.target.value });\n  submitChild = () => {\n    const name = this.state.newChildName.trim();\n    if (!name) return;\n    const id = name.toLowerCase().replace(/\\s+/g,'-');\n    if (!KIDS_META[id]) KIDS_META[id] = { name, color: 'oklch(45% 0.12 90)', soft: 'oklch(92% 0.04 90)' };\n    this.setState(s => ({ kids: [...s.kids, { id, name }], addChildOpen: false, newChildName: '' }));\n  };\n  removeChild(id){ this.setState(s => ({ kids: s.kids.filter(k => k.id !== id) })); }\n\n  onBulkText = (e) => this.setState({ bulkText: e.target.value });\n  submitBulk = () => {\n    const kid = this.state.bulkKid;\n    const lines = this.state.bulkText.split('\\n').map(l => l.trim()).filter(Boolean);\n    const parsed = [];\n    for (const line of lines) {\n      const parts = line.match(/(\".*?\"|[^,]+)(?=\\s*,|\\s*$)/g);\n      if (!parts || parts.length < 2) continue;\n      const clean = parts.map(p => p.trim().replace(/^\"|\"$/g, ''));\n      const [date, title, category, description, tags] = clean;\n      parsed.push({\n        id: Date.now() + Math.random(),\n        date: date, title: title,\n        category: CATS[category] ? category : 'achievement',\n        description: description || '', kid,\n        tags: tags ? tags.split(';').map(t => t.trim()).filter(Boolean) : [],\n      });\n    }\n    this.setState(s => ({ entries: [...s.entries, ...parsed], bulkOpen: false, bulkText: '' }));\n  };\n  setBulkKid(id){ this.setState({ bulkKid: id }); }\n\n  onShareEmail = (e) => this.setState({ shareEmail: e.target.value });\n  setShareScope(id){ this.setState({ shareScope: id }); }\n  toggleCanEdit = () => this.setState(s => ({ canEdit: !s.canEdit }));\n\n  renderVals() {\n    const s = this.state;\n    const kidMeta = (id) => KIDS_META[id] || { name: id, color: 'oklch(45% 0.1 90)', soft: 'oklch(92% 0.03 90)' };\n\n    let filtered = s.entries.filter(e => {\n      if (s.kidFilter !== 'both' && e.kid !== s.kidFilter) return false;\n      if (s.catFilter !== 'all' && e.category !== s.catFilter) return false;\n      if (s.search) {\n        const hay = (e.title + ' ' + e.description + ' ' + e.tags.join(' ')).toLowerCase();\n        if (!hay.includes(s.search.toLowerCase())) return false;\n      }\n      return true;\n    }).sort((a,b) => b.date.localeCompare(a.date));\n\n    const years = {};\n    filtered.forEach(e => {\n      const y = e.date.slice(0,4);\n      (years[y] = years[y] || []).push(e);\n    });\n    const groupedEntries = Object.keys(years).sort((a,b)=>b-a).map(year => ({\n      year,\n      items: years[year].map(e => {\n        const cat = CATS[e.category]; const km = kidMeta(e.kid);\n        return { ...e, dateLabel: fmtDate(e.date), catLabel: cat.label, catColor: cat.color, catSoft: cat.soft, kidName: km.name, kidColor: km.color, kidSoft: km.soft, tagList: e.tags };\n      })\n    }));\n\n    const kidChips = [\n      { id:'both', label:'Both', showDot:false },\n      ...s.kids.map(k => ({ id:k.id, label:k.name, showDot:true, dot: kidMeta(k.id).color }))\n    ].map(c => {\n      const active = s.kidFilter === c.id;\n      return { ...c, onClick: () => this.setKidFilter(c.id),\n        bg: active ? (c.id==='both' ? 'oklch(24% 0.02 60)' : kidMeta(c.id).soft) : 'oklch(99% 0.004 70)',\n        text: active ? (c.id==='both' ? 'white' : kidMeta(c.id).color) : 'oklch(45% 0.02 60)',\n        border: active ? (c.id==='both' ? 'oklch(24% 0.02 60)' : kidMeta(c.id).color) : 'oklch(89% 0.012 70)' };\n    });\n\n    const catList = [{id:'all',label:'All'}, ...Object.keys(CATS).map(k => ({id:k, label:CATS[k].label}))];\n    const catChips = catList.map(c => {\n      const active = s.catFilter === c.id;\n      const meta = c.id === 'all' ? { color:'white', soft:'oklch(24% 0.02 60)' } : CATS[c.id];\n      return { ...c, onClick: () => this.setCatFilter(c.id),\n        bg: active ? meta.soft : 'oklch(99% 0.004 70)',\n        text: active ? meta.color : 'oklch(45% 0.02 60)',\n        border: active ? meta.color : 'oklch(89% 0.012 70)' };\n    });\n\n    const sortedAsc = [...s.entries].sort((a,b) => a.date.localeCompare(b.date));\n    const journey = sortedAsc.map((e,i) => ({\n      dateLabel: fmtDate(e.date), title: e.title, kidName: kidMeta(e.kid).name, kidColor: kidMeta(e.kid).color, showLine: i < sortedAsc.length - 1,\n    }));\n\n    const donuts = s.kids.map(k => {\n      const km = kidMeta(k.id);\n      const items = s.entries.filter(e => e.kid === k.id);\n      const total = items.length || 1;\n      let acc = 0;\n      const segs = Object.keys(CATS).map(catKey => {\n        const count = items.filter(e => e.category === catKey).length;\n        const start = acc / total * 100; acc += count;\n        const end = acc / total * 100;\n        return { catKey, count, start, end };\n      });\n      const gradient = total > 0 && items.length > 0\n        ? `conic-gradient(${segs.map(sg => `${CATS[sg.catKey].color} ${sg.start}% ${sg.end}%`).join(', ')})`\n        : 'oklch(90% 0.012 70)';\n      return {\n        kidName: km.name, kidColor: km.color, total: items.length, gradient,\n        legend: segs.filter(sg => sg.count > 0).map(sg => ({ label: CATS[sg.catKey].label, count: sg.count, color: CATS[sg.catKey].color })),\n      };\n    });\n\n    const now = new Date('2026-06-25T00:00:00');\n    const buckets = [];\n    for (let i = 5; i >= 0; i--) {\n      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);\n      buckets.push({ y: d.getFullYear(), m: d.getMonth(), label: MONTHS[d.getMonth()], nayna: 0, nishka: 0 });\n    }\n    s.entries.forEach(e => {\n      const d = new Date(e.date + 'T00:00:00');\n      const b = buckets.find(bk => bk.y === d.getFullYear() && bk.m === d.getMonth());\n      if (b && (e.kid === 'nayna' || e.kid === 'nishka')) b[e.kid]++;\n    });\n    const maxCount = Math.max(1, ...buckets.map(b => b.nayna + b.nishka));\n    const monthlyBars = buckets.map(b => ({ label: b.label, naynaH: Math.round((b.nayna / maxCount) * 100), nishkaH: Math.round((b.nishka / maxCount) * 100) }));\n\n    const overviewCards = [\n      { label:'Total entries', value: s.entries.length, color:'oklch(24% 0.02 60)' },\n      { label:'This year', value: s.entries.filter(e=>e.date.startsWith('2026')).length, color:'oklch(24% 0.02 60)' },\n      ...s.kids.map(k => ({ label: k.name, value: s.entries.filter(e=>e.kid===k.id).length, color: kidMeta(k.id).color })),\n    ];\n\n    const kidsList = s.kids.map(k => {\n      const km = kidMeta(k.id);\n      return { name: k.name, initial: k.name[0], color: km.color, soft: km.soft, count: s.entries.filter(e=>e.kid===k.id).length, onRemove: () => this.removeChild(k.id) };\n    });\n\n    const shareScopeChips = [{id:'both',label:'Both/all'}, ...s.kids.map(k=>({id:k.id,label:k.name}))].map(c => {\n      const active = s.shareScope === c.id;\n      return { ...c, onClick: () => this.setShareScope(c.id), bg: active ? 'oklch(30% 0.05 300)' : 'oklch(99% 0.004 70)', text: active ? 'white' : 'oklch(45% 0.02 60)', border: active ? 'oklch(30% 0.05 300)' : 'oklch(89% 0.012 70)' };\n    });\n\n    const formKidChips = s.kids.map(k => {\n      const km = kidMeta(k.id); const active = (s.addEntryOpen ? s.newEntry.kid : s.bulkKid) === k.id;\n      return { label: k.name, onClick: () => { this.setFormKid(k.id); this.setBulkKid(k.id); }, bg: active ? km.soft : 'oklch(99% 0.004 70)', text: active ? km.color : 'oklch(45% 0.02 60)', border: active ? km.color : 'oklch(89% 0.012 70)' };\n    });\n    const formCatChips = Object.keys(CATS).map(ck => {\n      const cat = CATS[ck]; const active = s.newEntry.category === ck;\n      return { label: cat.label, onClick: () => this.setFormCat(ck), bg: active ? cat.soft : 'oklch(99% 0.004 70)', text: active ? cat.color : 'oklch(45% 0.02 60)', border: active ? cat.color : 'oklch(89% 0.012 70)' };\n    });\n\n    const navTabs = [\n      { id:'timeline', label:'Timeline' },\n      { id:'stats', label:'Journey' },\n      { id:'admin', label:'Admin' },\n    ].map(t => {\n      const active = s.screen === t.id;\n      return { ...t, onClick: () => this.setScreen(t.id), color: active ? 'oklch(30% 0.05 300)' : 'oklch(58% 0.02 60)', iconColor: active ? 'oklch(30% 0.05 300)' : 'oklch(70% 0.015 60)', iconOpacity: active ? 1 : 0.7 };\n    });\n\n    return {\n      isTimeline: s.screen === 'timeline', isStats: s.screen === 'stats', isAdmin: s.screen === 'admin',\n      search: s.search, onSearch: this.onSearch, kidChips, catChips, groupedEntries, noResults: groupedEntries.length === 0,\n      openAddEntry: this.openAddEntry, journey, donuts, monthlyBars,\n      overviewCards, kidsList, openAddChild: this.openAddChild, openBulk: this.openBulk,\n      shareEmail: s.shareEmail, onShareEmail: this.onShareEmail, shareScopeChips,\n      canEdit: s.canEdit, canEditBg: s.canEdit ? 'oklch(58% 0.14 175)' : 'oklch(88% 0.012 70)', canEditLeft: s.canEdit ? '19px' : '3px', toggleCanEdit: this.toggleCanEdit,\n      navTabs,\n      addEntryOpen: s.addEntryOpen, bulkOpen: s.bulkOpen, addChildOpen: s.addChildOpen,\n      closeModals: this.closeModals, stop: this.stop,\n      newEntry: s.newEntry, onFieldTitle: this.onFieldTitle, onFieldDate: this.onFieldDate, onFieldDesc: this.onFieldDesc, onFieldTags: this.onFieldTags,\n      formKidChips, formCatChips, submitEntry: this.submitEntry,\n      bulkText: s.bulkText, onBulkText: this.onBulkText, submitBulk: this.submitBulk,\n      newChildName: s.newChildName, onChildName: this.onChildName, submitChild: this.submitChild,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
