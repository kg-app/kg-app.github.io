<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sid's Notes</title>
<script>
  // apply saved theme before first paint to avoid a flash
  (function () {
    var t = null;
    try { t = localStorage.getItem('notes-theme'); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* Text colours are checked against WCAG AA (4.5:1) on --bg-surface, --bg-page and --bg-subtle. */
  :root {
    --primary: #7c3aed;
    --primary-hover: #6d28d9;
    --primary-pale: #ede9fe;
    --bg-page: #f8fafc;
    --bg-surface: #ffffff;
    --bg-subtle: #f1f5f9;
    --line: #e2e8f0;
    --line-strong: #c4b5fd;
    --ink: #0f172a;
    --ink-2: #334155;
    --ink-3: #536175;
    --ink-mute: #5f6f84;
    --radius: 10px;
    --radius-lg: 14px;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
    --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.12);
    --accent-text: #6d28d9;
    --link: #1d4ed8;
    --focus: #6d28d9;
    --mark-bg: #fde68a;
    --mark-ink: #1f2937;
    --overlay: rgba(15, 23, 42, .4);
    --danger: #b42318;
    --danger-pale: #fef3f2;
    --on-ink: #fff;
    --sidebar-w: 260px;
    --related-w: 290px;
    /* tag colours: ColorBrewer "Set2" (same in both themes). The pastels are under 3:1 on white, so dots/stripes get a thin dark rim (--tc-rim) */
    --tc-teal: #66c2a5; --tc-orange: #fc8d62; --tc-blue: #8da0cb; --tc-pink: #e78ac3; --tc-green: #a6d854; --tc-amber: #ffd92f;
    --tc-rim: rgba(15, 23, 42, .35);
    color-scheme: light;
  }

  /* VS Code "Dark+"-style palette */
  :root[data-theme="dark"] {
    --primary: #0e639c;
    --primary-hover: #1177bb;
    --primary-pale: #04395e;
    --bg-page: #1e1e1e;
    --bg-surface: #252526;
    --bg-subtle: #2d2d30;
    --line: #3c3c3c;
    --line-strong: #007fd4;
    --ink: #e0e0e0;
    --ink-2: #cccccc;
    --ink-3: #aaaaaa;
    --ink-mute: #9a9a9a;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.5);
    --accent-text: #4fc1ff;
    --link: #4fc1ff;
    --focus: #4fc1ff;
    --mark-bg: #665c00;
    --mark-ink: #fff8c5;
    --overlay: rgba(0, 0, 0, .6);
    --danger: #f48771;
    --danger-pale: #3a2623;
    --on-ink: #1e1e1e;
    --tc-rim: transparent;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg-page);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  body.resizing { cursor: col-resize; user-select: none; }

  button, input, textarea { font-family: inherit; }
  input, textarea { background: var(--bg-page); color: var(--ink); }
  input::placeholder, textarea::placeholder { color: var(--ink-mute); }
  body, #topbar, #sidebar, #related-pane, .modal, .btn { transition: background-color .2s, color .2s, border-color .2s; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  mark { background: var(--mark-bg); color: var(--mark-ink); border-radius: 2px; padding: 0 1px; }

  /* visible keyboard focus everywhere */
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  #search:focus-visible { outline: none; }

  .btn {
    font-size: 13px; font-weight: 600;
    padding: 7px 12px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--bg-surface); color: var(--ink-2);
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    transition: background .15s, border-color .15s;
  }
  .btn[hidden] { display: none; }
  .btn:hover:not(:disabled) { background: var(--bg-subtle); border-color: var(--line-strong); }
  .btn:active:not(:disabled) { transform: scale(0.98); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn-sm { padding: 4px 9px; font-size: 12px; border-radius: 8px; }
  .btn-icon { padding: 6px; line-height: 1; justify-content: center; }
  .btn-ghost { border-color: transparent; background: transparent; }

  /* ---------- top bar ---------- */
  #topbar {
    display: flex; align-items: center; gap: 10px;
    height: 52px; padding: 0 14px;
    border-bottom: 1px solid var(--line); background: var(--bg-surface);
  }
  #topbar .brand { font-weight: 700; font-size: 15px; white-space: nowrap; }
  #topbar .spacer { flex: 1; }
  #sidebar-toggle { display: none; }

  .search-wrap {
    position: relative; flex: 1; min-width: 0; max-width: 340px; display: flex; align-items: center;
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-page);
  }
  .search-wrap:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; border-color: transparent; }
  .search-wrap > svg.i { position: absolute; left: 9px; color: var(--ink-mute); pointer-events: none; }
  #search { flex: 1; min-width: 0; border: none; background: transparent; padding: 6px 30px 6px 30px; font-size: 13px; }
  #search-clear {
    position: absolute; right: 4px; width: 22px; height: 22px; border: none; border-radius: 50%;
    background: transparent; color: var(--ink-3); cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  #search-clear[hidden] { display: none; }
  #search-clear:hover { background: var(--bg-subtle); color: var(--ink); }
  #search-clear svg.i { width: 13px; height: 13px; }

  #related-toggle[hidden] { display: none; }
  #related-toggle .count { font-size: 11px; background: var(--bg-subtle); color: var(--ink-2); border-radius: 9px; padding: 0 6px; }

  /* ---------- menus (avatar, note actions) ---------- */
  .menu-wrap { position: relative; display: inline-flex; }
  .menu {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 40; min-width: 210px; padding: 4px;
    background: var(--bg-surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-md);
  }
  .menu[hidden] { display: none; }
  .menu-head { padding: 8px 10px 6px; font-size: 12px; color: var(--ink-3); border-bottom: 1px solid var(--line); margin-bottom: 4px; overflow-wrap: anywhere; }
  .menu-item {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
    padding: 7px 10px; border: none; background: none; border-radius: 6px;
    font-size: 13px; color: var(--ink-2); cursor: pointer;
  }
  .menu-item[hidden] { display: none; }
  .menu-item:hover, .menu-item:focus-visible { background: var(--bg-subtle); outline-offset: -2px; }
  .menu-item.danger { color: var(--danger); }
  .menu-item.danger:hover, .menu-item.danger:focus-visible { background: var(--danger-pale); }
  .menu-item .txt { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; }
  .menu-item .sub { font-size: 11px; color: var(--ink-3); }
  .switch { flex: none; position: relative; width: 30px; height: 18px; border-radius: 9px; background: var(--ink-mute); transition: background .15s; }
  .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
  [aria-checked="true"] > .switch { background: var(--primary); }
  [aria-checked="true"] > .switch::after { transform: translateX(12px); }
  #settings-wrap .menu { min-width: 250px; }
  .menu-sep { height: 1px; background: var(--line); margin: 4px 0; }
  #avatar-btn {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--primary); color: #fff;
    font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  }
  #avatar-btn.anon { background: var(--bg-subtle); color: var(--ink-2); }

  /* ---------- layout ---------- */
  #layout { position: relative; display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr) var(--related-w); height: calc(100vh - 52px); height: calc(100dvh - 52px); }
  #layout.no-related { grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }

  #sidebar, #related-pane { background: var(--bg-surface); overflow-y: auto; }
  /* only the groups/notes list scrolls; the buttons and tag chips stay put */
  #sidebar { border-right: 1px solid var(--line); padding: 12px 12px 0; display: flex; flex-direction: column; overflow: hidden; }
  #sidebar > * { flex: none; }
  #sidebar > #note-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; margin: 0 -12px; padding: 0 12px 12px; }
  #tag-chips { max-height: 112px; overflow-y: auto; }
  #related-pane { border-left: 1px solid var(--line); padding: 12px; }

  #sidebar-resizer {
    position: absolute; top: 0; bottom: 0; left: calc(var(--sidebar-w) - 3px); width: 6px; z-index: 10;
    cursor: col-resize; touch-action: none;
  }
  #sidebar-resizer:hover, #sidebar-resizer:active { background: var(--line-strong); opacity: .6; }
  #sidebar-resizer:focus-visible { outline-offset: -2px; background: var(--line-strong); }

  .section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); margin: 14px 0 6px; }
  .section-label:first-child { margin-top: 0; }
  .section-label.first { margin-top: 2px; }

  /* tags: neutral, so purple stays reserved for the primary action and selection */
  .tag-chip {
    display: inline-flex; font-size: 12px; padding: 2px 9px; border-radius: 12px;
    background: var(--bg-subtle); color: var(--ink-2); margin: 0 5px 5px 0; cursor: pointer; border: 1px solid var(--line);
  }
  .tag-chip:hover { border-color: var(--ink-mute); }
  .tag-chip[aria-pressed="true"] { background: var(--primary-pale); color: var(--accent-text); border-color: var(--line-strong); font-weight: 600; }

  /* tag colours: [data-tc] sets --tc; a note's left border is a stripe (one segment per distinct tag colour, max 3) */
  [data-tc="teal"] { --tc: var(--tc-teal); } [data-tc="orange"] { --tc: var(--tc-orange); } [data-tc="blue"] { --tc: var(--tc-blue); }
  [data-tc="pink"] { --tc: var(--tc-pink); } [data-tc="green"] { --tc: var(--tc-green); } [data-tc="amber"] { --tc: var(--tc-amber); }
  .tag-chip[data-tc]::before, .tag-dot { content: ''; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--tc); box-shadow: 0 0 0 1px var(--tc-rim); margin: auto 6px auto 0; }
  .note-row.tagged::before { content: ''; position: absolute; left: 0; top: 5px; bottom: 5px; width: 4px; border-radius: 3px; background: var(--tc-stripe); box-shadow: 0 0 0 1px var(--tc-rim); pointer-events: none; }
  .md-tag { padding: 0 5px; border-radius: 4px; background: var(--bg-subtle); color: var(--ink-2); text-decoration: underline 2px var(--tc, transparent); text-underline-offset: 3px; font-size: .92em; cursor: pointer; }
  .md-tag:hover { color: var(--ink); background: var(--line); }
  #tags-row .tag-pill[data-tc]::before { content: ''; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--tc); box-shadow: 0 0 0 1px var(--tc-rim); }
  #tags-row .tag-pill.inline { border-style: dashed; cursor: default; }

  /* settings gear + tag colours popover */
  #settings-btn {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg-subtle); color: var(--ink-2);
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  }
  #settings-btn:hover, #settings-btn[aria-expanded="true"] { color: var(--ink); border-color: var(--ink-mute); }
  #tc-pop {
    position: fixed; top: 58px; right: 14px; z-index: 45; width: min(380px, calc(100vw - 24px)); max-height: calc(100vh - 76px); max-height: calc(100dvh - 76px);
    display: flex; flex-direction: column; background: var(--bg-surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
  }
  #tc-pop[hidden] { display: none; }
  .tcp-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 4px 14px; }
  .tcp-head h2 { flex: 1; font-size: 14px; }
  .tcp-hint { padding: 0 14px 10px; font-size: 12px; line-height: 1.45; color: var(--ink-3); }
  .tcp-add { display: flex; gap: 6px; padding: 0 14px 10px; }
  .tcp-add input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 9px; font-size: 13px; }
  .tcp-add input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .tcp-list { overflow-y: auto; padding: 4px 6px 8px; border-top: 1px solid var(--line); }
  .tcp-empty { padding: 10px 8px; font-size: 12px; color: var(--ink-mute); }
  .tcp-row { display: flex; flex-direction: column; gap: 7px; padding: 8px; border-radius: var(--radius); }
  .tcp-row:hover { background: var(--bg-subtle); }
  .tcp-name { display: flex; align-items: baseline; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
  .tcp-name .n { font-weight: 400; font-size: 11px; color: var(--ink-3); }
  .tcp-sw { display: flex; flex-wrap: wrap; gap: 8px; }
  .sw {
    width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 0; background: var(--tc); color: #1f2937; box-shadow: 0 0 0 1px var(--tc-rim); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .sw svg.i { width: 12px; height: 12px; stroke-width: 3; visibility: hidden; }
  .sw[aria-checked="true"] { box-shadow: 0 0 0 2px var(--bg-surface), 0 0 0 4px var(--ink); }
  .sw[aria-checked="true"] svg.i { visibility: visible; }
  .sw:hover { transform: scale(1.12); }
  .sw:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  .sw.none { background: transparent; border: 1.5px dashed var(--ink-mute); color: var(--ink-3); }

  .note-row {
    position: relative;
    display: block; width: 100%; text-align: left; border: none; background: none; font-size: inherit; color: inherit; box-sizing: border-box;
    padding: 7px 9px; border-radius: var(--radius); cursor: pointer; margin-bottom: 1px;
  }
  .note-row { user-select: none; -webkit-user-select: none; }
  .note-row:hover { background: var(--bg-subtle); }
  .note-row.active { background: var(--primary-pale); }
  .note-row.selected { background: var(--primary-pale); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .note-row.selected.active { box-shadow: inset 0 0 0 1px var(--line-strong), inset -3px 0 0 var(--primary); } /* the note open in the editor (right edge: the left edge shows tag colours) */
  #sel-bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 6px; padding: 6px 8px; margin: 0 0 8px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--primary-pale); color: var(--accent-text); font-size: 12px; font-weight: 600; }
  #sel-bar[hidden] { display: none; }
  #sel-count { flex: 1; min-width: 0; }
  .note-row .r1 { display: flex; align-items: baseline; gap: 8px; }
  .note-row .t { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note-row .d { flex: none; font-size: 11px; color: var(--ink-mute); }
  .note-row .s { display: block; margin-top: 1px; font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note-row .s.none { font-style: italic; }
  .note-row.active .d, .note-row.active .s, .note-row.selected .d, .note-row.selected .s { color: var(--ink-2); } /* --ink-mute is under 4.5:1 on the selected tint */
  .note-row .pin-btn { flex: none; align-self: center; display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; margin: -3px 0 -3px -4px; border-radius: 5px; border: 1px solid var(--line-strong); background: var(--bg-surface); color: var(--primary); cursor: pointer; }
  .note-row .pin-btn .i { width: 12px; height: 12px; }
  .note-row .pin-btn .p { fill: currentColor; }
  .note-row .pin-btn .x { display: none; }
  .note-row .pin-btn:hover, .note-row .pin-btn:focus-visible { background: var(--bg-subtle); color: var(--ink); }
  .note-row .pin-btn:hover .p, .note-row .pin-btn:focus-visible .p { display: none; }
  .note-row .pin-btn:hover .x, .note-row .pin-btn:focus-visible .x { display: inline-block; }
  .empty-list { font-size: 13px; color: var(--ink-mute); padding: 8px 9px; }

  /* new note: split button (main = ungrouped note, caret = pick a group) */
  .split { position: relative; display: flex; margin-bottom: 8px; }
  .split .menu-wrap { position: static; }
  #new-note-btn { flex: 1; min-width: 0; justify-content: center; border-top-right-radius: 0; border-bottom-right-radius: 0; }
  #new-note-caret { height: 100%; padding: 7px 9px; border-top-left-radius: 0; border-bottom-left-radius: 0; border-left-color: rgba(255,255,255,.4); }
  .split .menu { left: 0; right: 0; min-width: 0; top: calc(100% + 4px); max-height: 50vh; overflow-y: auto; }
  .split .menu-item .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #new-group-btn { width: 100%; justify-content: center; margin-bottom: 12px; color: var(--ink-3); }
  #new-group-btn:hover:not(:disabled) { color: var(--ink); }

  /* groups */
  .grp { border-radius: var(--radius); margin-bottom: 2px; }
  .grp-head { display: flex; align-items: center; gap: 2px; border-radius: var(--radius); cursor: grab; }
  .grp-head:hover { background: var(--bg-subtle); }
  .grp-toggle { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; border: none; background: none; padding: 6px 6px; font: inherit; font-size: 13px; font-weight: 700; color: var(--ink); text-align: left; cursor: pointer; border-radius: 6px; }
  .grp-toggle .chev { width: 12px; height: 12px; color: var(--ink-3); transition: transform .15s; }
  .grp[data-open="true"] .grp-toggle .chev { transform: rotate(90deg); }
  .grp-toggle .fi { width: 14px; height: 14px; color: var(--ink-3); }
  .grp-toggle .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grp-toggle .cnt { flex: none; font-size: 11px; font-weight: 500; color: var(--ink-3); }
  .grp-act { flex: none; width: 24px; height: 24px; border: none; background: none; border-radius: 6px; color: var(--ink-3); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; opacity: 0; }
  .grp-head:hover .grp-act, .grp-head:focus-within .grp-act, .grp-act[aria-expanded="true"] { opacity: 1; }
  .grp-act:hover { background: var(--line); color: var(--ink); }
  .grp-act .i { width: 14px; height: 14px; }
  @media (hover: none) { .grp-act { opacity: 1; } }
  .grp .menu { min-width: 170px; }
  .grp-body { margin: 0 0 4px 12px; padding-left: 6px; border-left: 1px solid var(--line); }
  .grp[data-open="false"] .grp-body { display: none; }
  .grp-empty { font-size: 12px; font-style: italic; color: var(--ink-mute); padding: 4px 9px 6px; }
  .ungrouped { margin-top: 8px; padding: 8px 0 2px; border-top: 1px solid var(--line-strong); border-radius: 0 0 var(--radius) var(--radius); }
  .ug-toggle { width: 100%; padding: 4px 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); }
  .ug-toggle:hover { color: var(--ink); }
  .ungrouped[data-open="true"] .ug-toggle .chev { transform: rotate(90deg); }
  .ungrouped[data-open="false"] .ungrouped-body { display: none; }
  .section-label.sub { text-transform: none; letter-spacing: 0; font-weight: 600; margin: 8px 0 4px; }
  .note-row .g { flex: none; max-width: 72px; font-size: 10px; padding: 0 6px; border-radius: 8px; border: 1px solid var(--line); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note-row.dragging, .grp.dragging { opacity: .45; }
  .grp.drop-target, .ungrouped.drop-target { background: var(--primary-pale); outline: 1px dashed var(--primary); outline-offset: -1px; }
  .grp.drop-before { box-shadow: 0 -2px 0 var(--primary); }
  .grp.drop-after { box-shadow: 0 2px 0 var(--primary); }

  /* group dialog (create / rename / delete / move) */
  .gm-msg { font-size: 13px; line-height: 1.5; color: var(--ink-2); }
  .gm-msg[hidden], #gm-input[hidden], #gm-list[hidden], #gm-ok[hidden] { display: none; }
  #gm-list { display: flex; flex-direction: column; gap: 6px; max-height: 50vh; overflow-y: auto; }
  .mv-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-surface); color: var(--ink-2); font-size: 13px; cursor: pointer; }
  .mv-item:hover { background: var(--bg-subtle); }
  .mv-item[aria-current="true"] { background: var(--primary-pale); border-color: var(--line-strong); color: var(--accent-text); font-weight: 600; }
  .btn-danger { color: var(--danger); border-color: var(--danger); background: var(--danger-pale); font-weight: 700; }
  .btn-danger:hover:not(:disabled) { border-color: var(--danger); }

  /* ---------- editor ---------- */
  #editor-pane { overflow: hidden; min-width: 0; }
  #editor-pane.empty-state { display: flex; align-items: center; justify-content: center; color: var(--ink-mute); font-size: 14px; padding: 24px; text-align: center; }

  .editor-wrap { height: 100%; max-width: 720px; margin: 0 auto; padding: 16px 24px 18px; display: flex; flex-direction: column; }
  .editor-wrap[data-mode="split"] { max-width: 1240px; }

  .meta-row { display: flex; align-items: center; justify-content: space-between; gap: 6px 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-mute); margin-bottom: 6px; }

  #tags-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 10px; }
  #tags-row .tag-pill {
    font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--bg-subtle); color: var(--ink-2); border: 1px solid var(--line);
    display: inline-flex; align-items: center; gap: 5px;
  }
  #tags-row .tag-pill button { border: none; background: none; cursor: pointer; color: var(--ink-3); font-size: 12px; line-height: 1; }
  #tags-row .tag-pill button:hover { color: var(--ink); }
  #tag-input-wrap { position: relative; display: inline-block; }
  #tag-suggest {
    position: absolute; top: 100%; left: 0; z-index: 20; min-width: 160px; max-height: 200px; overflow-y: auto;
    margin-top: 4px; padding: 4px; background: var(--bg-surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow-md);
  }
  #tag-suggest[hidden] { display: none; }
  .tag-suggest-item { padding: 4px 8px; font-size: 12px; color: var(--ink-2); border-radius: 6px; cursor: pointer; }
  .tag-suggest-item:hover, .tag-suggest-item.hi { background: var(--primary-pale); color: var(--accent-text); }
  #tag-input { border: none; background: none; font-size: 12px; color: var(--ink-2); width: 90px; border-radius: 4px; }

  #toolbar { display: flex; align-items: center; gap: 4px; padding: 6px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 10px; flex-wrap: wrap; }
  #toolbar .spacer { flex: 1; }
  #toolbar .tb-sep { width: 8px; }

  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: none; background: var(--bg-surface); color: var(--ink-2); font-size: 12px; font-weight: 600; padding: 4px 10px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button:hover { background: var(--bg-subtle); }
  .seg button[aria-pressed="true"] { background: var(--primary-pale); color: var(--accent-text); }
  .seg button:focus-visible { outline-offset: -2px; }

  #save-status { font-size: 12px; color: var(--ink-mute); min-width: 66px; text-align: right; }
  #save-status[data-state="saved"]::before { content: '✓ '; }
  #save-status[data-state="error"] { color: var(--danger); font-weight: 600; }

  #vis-btn.on { color: var(--accent-text); border-color: var(--line-strong); background: var(--primary-pale); }

  #edit-area { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 16px; }
  #edit-area[data-mode="split"] { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  #edit-area[data-mode="edit"] #md-preview, #edit-area[data-mode="preview"] #md-input { display: none; }
  #md-input {
    width: 100%; height: 100%; min-height: 0; resize: none; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; font-size: 14px; line-height: 1.6; font-family: 'SFMono-Regular', Consolas, monospace;
  }
  #md-input:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; border-color: transparent; }
  #md-preview { min-height: 0; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; font-size: 15px; line-height: 1.7; overflow-y: auto; }
  #edit-area[data-mode="preview"] #md-preview { border: none; padding: 4px 0; }
  #md-preview img { max-width: 100%; border-radius: 6px; }
  #md-preview ul, #md-preview ol, #ro-content ul, #ro-content ol { margin: 0 0 10px; padding-left: 26px; }
  #md-preview ul, #ro-content ul { list-style: disc; }
  #md-preview ol, #ro-content ol { list-style: decimal; }
  #md-preview ul ul, #ro-content ul ul { list-style: circle; }
  #md-preview ul ul ul, #ro-content ul ul ul { list-style: square; }
  #md-preview li ul, #md-preview li ol, #ro-content li ul, #ro-content li ol { margin: 2px 0; }
  #md-preview li, #ro-content li { margin: 2px 0; }
  #md-preview p, #ro-content p { margin: 0 0 10px; }
  #md-preview h1, #md-preview h2, #md-preview h3, #md-preview h4, #md-preview h5, #md-preview h6,
  #ro-content h1, #ro-content h2, #ro-content h3, #ro-content h4, #ro-content h5, #ro-content h6 { margin: 16px 0 8px; line-height: 1.3; }
  #md-preview h1, #ro-content h1 { font-size: 1.8em; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  #md-preview h2, #ro-content h2 { font-size: 1.45em; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
  #md-preview h3, #ro-content h3 { font-size: 1.2em; }
  #md-preview h4, #ro-content h4 { font-size: 1.05em; }
  #md-preview h5, #ro-content h5, #md-preview h6, #ro-content h6 { font-size: 1em; color: var(--ink-3); }
  #md-preview > :first-child, #ro-content > :first-child { margin-top: 0; }
  #md-preview hr, #ro-content hr { border: none; border-top: 1px solid var(--line-strong); margin: 16px 0; }
  #md-preview del, #ro-content del { opacity: .65; }
  #md-preview li > input[type="checkbox"], #ro-content li > input[type="checkbox"] { margin: 0 6px 0 -18px; vertical-align: middle; }
  #md-preview li:has(> input[type="checkbox"]), #ro-content li:has(> input[type="checkbox"]) { list-style: none; }
  #md-preview pre code, #ro-content pre code { background: none; padding: 0; }
  #md-preview pre, #ro-content pre { background: var(--bg-subtle); padding: 10px; border-radius: 8px; overflow-x: auto; margin: 0 0 10px; }
  #md-preview blockquote, #ro-content blockquote { margin: 0 0 10px; }
  #md-preview th, #ro-content th { background: var(--bg-subtle); text-align: left; }
  #md-preview img, #ro-content img { max-width: 100%; }
  #md-preview table, #ro-content table { border-collapse: collapse; margin: 0 0 10px; }
  #md-preview a.note-link { color: var(--link); text-decoration: none; border-bottom: 1px dashed currentColor; cursor: pointer; }
  #md-preview a.note-link.missing { color: var(--ink-mute); border-bottom-style: dotted; }
  #md-preview code { background: var(--bg-subtle); padding: 1px 4px; border-radius: 4px; font-size: 13px; }

  /* [[ note picker */
  #link-picker {
    position: fixed; z-index: 45; width: 280px; max-height: 280px; overflow-y: auto; padding: 4px;
    background: var(--bg-surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-md);
  }
  #link-picker[hidden] { display: none; }
  .lp-item { display: block; padding: 6px 9px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
  .lp-item .t { display: block; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lp-item .s { display: block; font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lp-item.hi, .lp-item:hover { background: var(--primary-pale); }
  .lp-item.create .t { color: var(--accent-text); }
  .lp-hint { padding: 4px 9px 2px; font-size: 11px; color: var(--ink-mute); }

  /* ---------- related panel ---------- */
  .pane-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .pane-head .section-label { margin: 0; }
  .rel-section { margin-top: 10px; }
  .rel-section summary { font-size: 12px; font-weight: 700; color: var(--ink-2); cursor: pointer; padding: 3px 0; list-style: none; display: flex; align-items: center; gap: 6px; border-radius: 4px; }
  .rel-section summary::-webkit-details-marker { display: none; }
  .rel-section summary::before { content: '▸'; font-size: 10px; color: var(--ink-3); transition: transform .15s; }
  .rel-section[open] summary::before { transform: rotate(90deg); }
  .rel-section .n { font-weight: 500; color: var(--ink-3); }
  .rel-item { display: block; width: 100%; text-align: left; font-size: inherit; color: inherit; background: none; border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 10px; margin-top: 6px; cursor: pointer; }
  .rel-item:hover { border-color: var(--line-strong); background: var(--bg-subtle); }
  .rel-item .t { display: block; font-size: 12px; font-weight: 600; color: var(--ink); margin-bottom: 2px; overflow-wrap: anywhere; }
  .rel-item .s { display: block; font-size: 12px; color: var(--ink-3); line-height: 1.4; overflow-wrap: anywhere; }
  .rel-item .m { display: block; font-size: 11px; color: var(--ink-mute); margin-top: 3px; overflow-wrap: anywhere; }
  .rel-empty { margin-top: 8px; font-size: 12px; color: var(--ink-3); line-height: 1.45; }
  .rel-sem { margin-top: 14px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 11px; color: var(--ink-mute); line-height: 1.4; }
  .rel-sem:empty { display: none; }

  /* ---------- auth modal ---------- */
  .modal-overlay { display: none; position: fixed; inset: 0; background: var(--overlay); align-items: center; justify-content: center; z-index: 50; }
  .modal-overlay.open { display: flex; }
  .modal { width: min(380px, 92vw); background: var(--bg-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .modal-head h2 { font-size: 16px; }
  .modal-close { border: none; background: none; font-size: 16px; cursor: pointer; color: var(--ink-3); }
  .modal-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .modal-body input { padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); font-size: 13px; }
  #auth-fields { display: flex; flex-direction: column; gap: 10px; }
  #auth-fields:empty { display: none; }
  .auth-divider { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--ink-mute); }
  .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .auth-msg { font-size: 11px; min-height: 1.2em; }
  .auth-msg.err { color: var(--danger); }
  .modal-foot { padding: 12px 18px; border-top: 1px solid var(--line); text-align: right; }

  /* ---------- toast ---------- */
  #md-preview a, #ro-content a { color: var(--link); }
  #md-preview blockquote, #ro-content blockquote { border-left: 3px solid var(--line-strong); padding-left: 12px; color: var(--ink-3); }
  #md-preview pre, #md-preview code { color: var(--ink-2); }
  #md-preview th, #md-preview td, #ro-content th, #ro-content td { border: 1px solid var(--line); padding: 4px 8px; }
  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(0); background: var(--ink); color: var(--on-ink);
    font-size: 13px; padding: 9px 16px; border-radius: 20px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60;
    display: flex; align-items: center; gap: 14px;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }
  #toast.show.has-action { pointer-events: auto; }
  #toast button { border: none; background: none; color: inherit; font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; border-radius: 4px; }
  #toast button:focus-visible { outline-color: var(--on-ink); }

  /* ---------- read only view ---------- */
  #readonly-view { max-width: 640px; margin: 40px auto; padding: 0 20px; }
  #ro-app { font-size: 13px; font-weight: 700; color: var(--ink-3); letter-spacing: .02em; margin-bottom: 10px; }
  #ro-meta { font-size: 12px; color: var(--ink-mute); margin-bottom: 16px; }
  #ro-badge { display: inline-block; font-size: 11px; background: var(--primary-pale); color: var(--accent-text); padding: 3px 9px; border-radius: 10px; margin-bottom: 14px; }
  #ro-content { font-size: 15px; line-height: 1.7; }
  #ro-content img { max-width: 100%; border-radius: 6px; }

  /* ---------- responsive ---------- */
  @media (min-width: 761px) {
    #layout.no-related #related-pane { display: none; }
  }
  @media (max-width: 760px) {
    #layout, #layout.no-related { grid-template-columns: minmax(0, 1fr); }
    #sidebar, #related-pane { display: none; position: fixed; inset: 52px 0 0 0; z-index: 30; border: none; }
    #sidebar.open { display: flex; }
    #related-pane.open { display: block; }
    #sidebar-resizer { display: none; }
    #sidebar-toggle { display: inline-flex; }
    #edit-area[data-mode="split"] { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
    .search-wrap { max-width: none; }
    .editor-wrap { padding: 12px 14px; }
  }
  @media (max-width: 520px) {
    #topbar .brand { display: none; }
    #related-toggle .label { display: none; }
  }
</style>
</head>
<body>

<div id="app" hidden>
  <div id="topbar">
    <button class="btn btn-icon" id="sidebar-toggle" onclick="toggleSidebar()" aria-label="Toggle note list">☰</button>
    <div class="brand">Notes</div>
    <div class="search-wrap">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label class="sr-only" for="search">Search notes</label>
      <input id="search" type="text" placeholder="Search notes..." autocomplete="off" data-lpignore="true" data-1p-ignore data-form-type="other" oninput="onSearchInput()" onkeydown="if(event.key==='Escape')clearSearch()">
      <button id="search-clear" onclick="clearSearch()" aria-label="Clear search" hidden>
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="spacer"></div>
    <button class="btn btn-sm" id="related-toggle" onclick="toggleRelated()" aria-expanded="true" aria-controls="related-pane" hidden>
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1 1"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1-1"/></svg>
      <span class="label">Related</span><span class="count" id="related-count"></span>
    </button>
    <button class="btn btn-sm btn-primary" id="btn-signin" onclick="openModal('auth-modal')">Sign in</button>
    <div class="menu-wrap" id="settings-wrap">
      <button id="settings-btn" onclick="toggleMenu(this)" aria-haspopup="menu" aria-expanded="false" aria-label="Settings" title="Settings"></button>
      <div class="menu" role="menu" hidden>
        <button class="menu-item" role="menuitem" id="tagcolors-item" onclick="closeMenus(); openTagColors()"></button>
        <div class="menu-sep"></div>
        <button class="menu-item" role="menuitemcheckbox" id="theme-item" aria-checked="false" onclick="toggleTheme()">
          <span class="txt">Dark mode</span><span class="switch" aria-hidden="true"></span>
        </button>
        <button class="menu-item" role="menuitemcheckbox" id="sem-item" aria-checked="false" onclick="toggleSemantic()">
          <span class="txt">Semantic matching<span class="sub" id="sem-sub"></span></span><span class="switch" aria-hidden="true"></span>
        </button>
      </div>
    </div>
    <div class="menu-wrap" id="avatar-wrap">
      <button id="avatar-btn" class="anon" onclick="toggleMenu(this)" aria-haspopup="menu" aria-expanded="false" aria-label="Account menu"></button>
      <div class="menu" role="menu" hidden>
        <div class="menu-head" id="menu-user" hidden></div>
        <button class="menu-item" role="menuitem" id="signout-item" onclick="closeMenus(); signOut()" hidden>
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Sign out
        </button>
      </div>
    </div>
  </div>

  <div id="layout">
    <aside id="sidebar">
      <div class="split">
        <button class="btn btn-primary" id="new-note-btn" onclick="createNewNote()">+ New note</button>
        <div class="menu-wrap">
          <button class="btn btn-primary" id="new-note-caret" onclick="toggleMenu(this)" aria-haspopup="menu" aria-expanded="false" aria-label="New note in a group" title="New note in a group"></button>
          <div class="menu" id="new-note-menu" role="menu" hidden></div>
        </div>
      </div>
      <button class="btn btn-sm btn-ghost" id="new-group-btn" onclick="newGroupPrompt()">+ New group</button>
      <div class="section-label" id="tags-label">Tags</div>
      <div id="tag-chips"></div>
      <div id="sel-bar" hidden>
        <span id="sel-count" aria-live="polite"></span>
        <button class="btn btn-sm" onclick="openMoveModal(selectedList())">Move to…</button>
        <button class="btn btn-sm btn-ghost" onclick="clearSelection()">Clear</button>
      </div>
      <div id="note-list"></div>
    </aside>
    <div id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" aria-valuemin="200" aria-valuemax="480" tabindex="0" title="Drag to resize · double-click to reset"></div>

    <main id="editor-pane" class="empty-state">
      <div>Select a note, or create a new one.</div>
    </main>

    <aside id="related-pane" hidden aria-label="Related notes">
      <div class="pane-head">
        <div class="section-label">Related</div>
        <button class="btn btn-icon btn-sm btn-ghost" onclick="toggleRelated()" aria-label="Collapse related panel" title="Collapse panel">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
      <div id="related-body"></div>
      <div class="rel-sem" id="rel-sem" aria-live="polite"></div>
    </aside>
  </div>
</div>

<div id="readonly-view" hidden>
  <div id="ro-app">Sid's Notes</div>
  <span id="ro-badge">Read-only · shared note</span>
  <h1 id="ro-title" style="font-size:22px;margin-bottom:4px;"></h1>
  <div id="ro-meta"></div>
  <div id="ro-content"></div>
</div>

<!-- AUTH MODAL -->
<div class="modal-overlay" id="auth-modal">
  <div class="modal">
    <div class="modal-head">
      <h2>Sign in</h2>
      <button class="modal-close" onclick="closeModal('auth-modal')" aria-label="Close">✕</button>
    </div>
    <div class="modal-body">
      <button class="btn btn-primary" onclick="signInWithGoogle()">Continue with Google</button>
      <div class="auth-divider">or email</div>
      <div id="auth-fields"></div>
      <div class="auth-msg" id="auth-msg"></div>
      <button class="btn" onclick="signInWithEmail()">Sign in with email</button>
      <button class="btn" onclick="registerWithEmail()">Create account</button>
    </div>
    <div class="modal-foot">
      <button class="btn btn-sm" onclick="closeModal('auth-modal')">Cancel</button>
    </div>
  </div>
</div>

<!-- GROUP DIALOG: create / rename / delete / move -->
<div class="modal-overlay" id="group-modal" role="dialog" aria-modal="true" aria-labelledby="gm-title">
  <div class="modal">
    <div class="modal-head">
      <h2 id="gm-title"></h2>
      <button class="modal-close" onclick="closeGroupModal()" aria-label="Close">✕</button>
    </div>
    <div class="modal-body">
      <div class="gm-msg" id="gm-msg" hidden></div>
      <input id="gm-input" maxlength="60" autocomplete="off" data-lpignore="true" data-1p-ignore data-form-type="other" aria-label="Group name" placeholder="Group name" hidden>
      <div id="gm-list" hidden></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-sm" id="gm-cancel" onclick="closeGroupModal()">Cancel</button>
      <button class="btn btn-sm btn-primary" id="gm-ok" onclick="submitGroupModal()" hidden></button>
    </div>
  </div>
</div>

<div id="link-picker" role="listbox" aria-label="Link to a note" hidden></div>
<div id="tc-pop" role="dialog" aria-label="Tag colors" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="image-input" accept="image/*" hidden onchange="onImageFileChosen(event)">

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-storage-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/turndown/7.2.0/turndown.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/turndown-plugin-gfm@1.0.2/dist/turndown-plugin-gfm.js"></script>

<script>
const ICONS = {
  sun: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',

<script>
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

let currentUser = null;
let notes = [];              // full note objects for the signed-in user, cached in memory
let folders = [];            // note groups: [{ id, name, order }] in display order (stored in users/{uid}/folders)
let activeNoteId = null;
let activeNote = null;       // { title, content, tags, public, pinned }
let activeTagFilter = null;
let saveTimer = null;

let relatedAvailable = false;   // a note is open, so the Related panel / toggle exist (the user can still collapse it)
let pendingDelete = null;    // { note, timer } — hard delete is deferred so the undo toast can bring it back

/* ---------- helpers ---------- */

function pad(n) { return String(n).padStart(2, '0'); }
function defaultTitle(d) {

}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  return text.split(re).map((p, i) => i % 2 ? `<mark>${escapeHtml(p)}</mark>` : escapeHtml(p)).join('');
}

let toastTimer = null;
function toast(msg, opts = {}) {
  const el = document.getElementById('toast');
  el.innerHTML = '';
  const span = document.createElement('span');
  span.textContent = msg;
  el.appendChild(span);
  el.classList.toggle('has-action', !!opts.action);
  if (opts.action) {
    const b = document.createElement('button');
    b.textContent = opts.action;
    b.onclick = () => { hideToast(); opts.onAction(); };

// The email/password inputs exist in the DOM only while the sign-in modal is open, so browsers

function openModal(id) {

}

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
function onSearchInput() {

}

function notesCol(uid) { return db.collection('users').doc(uid).collection('notes'); }

/* ---------- menus ---------- */

function toggleMenu(btn) {
  const menu = btn.nextElementSibling;
  const opening = menu.hidden;
  closeMenus();
  if (!opening) return;
  menu.hidden = false;
  btn.setAttribute('aria-expanded', 'true');
  const first = [...menu.querySelectorAll('[role^=menuitem]')].find(i => !i.hidden);
  if (first) first.focus();
}
function closeMenus(returnFocus) {
  document.querySelectorAll('.menu').forEach(m => {
    if (m.hidden) return;
    m.hidden = true;
    const b = m.previousElementSibling;
    b.setAttribute('aria-expanded', 'false');

}
document.addEventListener('click', e => { if (!e.target.closest('.menu-wrap')) closeMenus(); });
document.addEventListener('keydown', e => {
  const menu = e.target.closest && e.target.closest('.menu');
  if (!menu) return;
  const items = [...menu.querySelectorAll('[role^=menuitem]')].filter(i => !i.hidden);
  const i = items.indexOf(document.activeElement);
  if (e.key === 'Escape') { e.preventDefault(); closeMenus(true); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
  else if (e.key === 'Tab') closeMenus();

/* ---------- auth ---------- */

function signInWithGoogle() {

    .then(() => closeModal('auth-modal'))
    .catch(e => showAuthMsg(e.message));
}
function signInWithEmail() {
  auth.signInWithEmailAndPassword(val('auth-email'), val('auth-password'))
    .then(() => closeModal('auth-modal'))
    .catch(e => showAuthMsg(e.message));
}
function registerWithEmail() {
  auth.createUserWithEmailAndPassword(val('auth-email'), val('auth-password'))
    .then(() => closeModal('auth-modal'))
    .catch(e => showAuthMsg(e.message));
}
function signOut() { auth.signOut(); }
function val(id) { return document.getElementById(id).value.trim(); }
function showAuthMsg(m) { const el = document.getElementById('auth-msg'); el.textContent = m; el.classList.add('err'); }

function renderAccount(user) {
  const btn = document.getElementById('avatar-btn');
  const who = user ? (user.displayName || user.email || '') : '';
  btn.classList.toggle('anon', !user);
  btn.innerHTML = user ? escapeHtml((who.trim()[0] || '?').toUpperCase()) : ICONS.user;
  btn.title = who || 'Account';

auth.onAuthStateChanged(async user => {
  document.getElementById('search').value = '';
  folders = [];

  currentUser = user;
  renderAccount(user);
  if (user) {
    await loadNotes();
  } else {
    notes = [];
    activeNoteId = null; activeNote = null;
    tagColors = { ...DEFAULT_TAG_COLORS };
    closeTagColors(false);
    semReset();
    renderNoteList();
    renderTagChips();
    showEmptyEditor('Sign in to see your notes.');

/* ---------- data loading ---------- */

async function loadNotes() {
  await loadFolders(); // never throws; notes still load if groups can't
  await loadTagColors(); // never throws either
  try {
    const snap = await notesCol(currentUser.uid).orderBy('updatedAt', 'desc').get();
    notes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderNoteList();
    renderTagChips();
    migrateLinkNames();
    setTimeout(semSchedule, 1200); // start the embedding index once the UI has settled
  } catch (err) {
    console.error('loadNotes failed:', err.code, err.message);
    showEmptyEditor(`Couldn't load notes: ${err.code || err.message}. Check that firestore.rules has been deployed for this project.`);
    toast(`Load failed: ${err.code || err.message}`);
  }

/* ---------- note naming, text extraction ---------- */

// Strip markdown down to readable text (used for titles, snippets, keywords)
function plainText(s) {
  return (s || '')
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/\[\[([^\]]+)\]\]/g, '$1')
    .replace(/^[ \t]{0,3}(#{1,6}|>|[-*+]|\d+[.)])[ \t]+(\[[ xX]\][ \t]+)?/gm, '')
    .replace(/[*_~`]+/g, '')
    .replace(/\s+/g, ' ').trim();
}
// A note's title comes from its content: the first heading ("# Title") if the note starts with one,
// otherwise the first few words of its first line. `idx` is the line it came from, `full` the whole line.
const TITLE_WORDS = 8;
function titleLine(content) {
  const lines = (content || '').split('\n');
  for (let i = 0; i < lines.length; i++) {
    if (!lines[i].trim() || /^\s*(```|~~~)/.test(lines[i])) continue;
    const full = plainText(lines[i]).slice(0, 200);
    if (!full) continue;
    const isHeading = /^\s{0,3}#{1,6}\s/.test(lines[i]);
    const text = isHeading ? full : full.split(' ').slice(0, TITLE_WORDS).join(' ');
    return { text, full, idx: i };
  }
  return { text: '', full: '', idx: -1 };
}
function derivedTitle(content) { return titleLine(content).text; }
// What the note is called in the list
function displayTitle(n) { return derivedTitle(n.content) || 'Untitled'; }
// Name used when inserting a [[link]] to this note
function linkName(n) { return derivedTitle(n.content); }
// [[links]] resolve by title: the derived title, the whole first line, or (for very old links) the legacy timestamp title
function findNoteByLinkName(name) {
  const k = name.trim().toLowerCase();
  if (!k) return null;
  return notes.find(n => derivedTitle(n.content).toLowerCase() === k)
    || notes.find(n => titleLine(n.content).full.toLowerCase() === k)
    || notes.find(n => (n.title || '').trim().toLowerCase() === k);
}
function bodySnippet(n, max = 140) {
  const t = titleLine(n.content);
  if (t.idx < 0) return '';
  const rest = t.full.slice(t.text.length).trim(); // words of the first line that didn't fit in the title
  const after = plainText((n.content || '').split('\n').slice(t.idx + 1).join('\n'));
  return [rest, after].filter(Boolean).join(' ').slice(0, max);

/* ---------- dates ---------- */

function toDate(ts) { return ts && ts.toDate ? ts.toDate() : (ts instanceof Date ? ts : null); }
function noteDate(n) { return toDate(n.updatedAt) || toDate(n.createdAt) || null; }
function startOfToday() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function formatListDate(d) {
  if (!d) return '';
  const sod = startOfToday();
  const yest = new Date(sod); yest.setDate(yest.getDate() - 1);
  if (d >= yest) return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  return d.toLocaleDateString([], d.getFullYear() === sod.getFullYear() ? { month: 'short', day: 'numeric' } : { month: 'short', day: 'numeric', year: 'numeric' });
}
function groupNotes(items) {
  const sod = startOfToday();
  const yest = new Date(sod); yest.setDate(yest.getDate() - 1);
  const g = { Pinned: [], Today: [], Yesterday: [], Earlier: [] };
  items.forEach(n => {
    const d = noteDate(n);
    if (n.pinned) g.Pinned.push(n);
    else if (d && d >= sod) g.Today.push(n);
    else if (d && d >= yest) g.Yesterday.push(n);
    else g.Earlier.push(n);
  });
  return Object.entries(g).filter(([, a]) => a.length);
}

/* ---------- note list / tags / search ---------- */

/* ---------- tags: metadata tags + inline #tags, and tag colours ---------- */

const TAG_COLORS = [['teal', 'Teal'], ['orange', 'Orange'], ['blue', 'Blue'], ['pink', 'Pink'], ['green', 'Green'], ['amber', 'Yellow']];
const LEGACY_TAG_COLORS = { red: 'pink', purple: 'blue' }; // ids from the old nine-colour palette, mapped to the nearest remaining one (gray is dropped)
const TAG_COLOR_IDS = new Set(TAG_COLORS.map(c => c[0]));
const DEFAULT_TAG_COLORS = { important: 'pink', revisit: 'pink', warning: 'orange', remember: 'orange' }; // first-run examples; edit or clear in Settings
let tagColors = { ...DEFAULT_TAG_COLORS }; // tag key (lower-case) -> colour id. One colour per tag; many tags can share a colour.

function tagKey(t) { return String(t || '').trim().replace(/^#+/, '').toLowerCase(); }

// "#tag" in note text: must start a line or follow whitespace / "(" and begin with a letter. So headings ("# Title"),
// issue numbers (#123), URL fragments (page#top), hex colours (#ff8800), code, [[links]] and \#escapes are not tags.
const INLINE_TAG_RE = /(^|[\s(])#(\p{L}[\p{L}\p{N}_\/-]*)/gu;
function inlineTagName(raw) {

  if (!name) return null;
  if (/^[0-9a-f]+$/i.test(name) && /\d/.test(name) && [3, 4, 6, 8].includes(name.length)) return null;
  return name;
}
function inlineTags(content) {
  if (!content || content.indexOf('#') < 0) return [];
  const text = content
    .replace(/(```|~~~)[\s\S]*?(\1|$)/g, ' ')
    .replace(/`[^`\n]*`/g, ' ')
    .replace(/\[\[[^\]]*\]\]/g, ' ')
    .replace(/\]\([^)]*\)/g, ' ')
    .replace(/<[^>]+>/g, ' ')
    .replace(/\\#/g, ' ');
  const out = [], seen = new Set(), re = new RegExp(INLINE_TAG_RE.source, 'gu');
  let m;
  while ((m = re.exec(text))) {
    const name = inlineTagName(m[2]);
    if (name && !seen.has(name.toLowerCase())) { seen.add(name.toLowerCase()); out.push(name); }
  }
  return out;
}

// A note's tags: the ones in its metadata row first, then any inline #tags (case-insensitive de-dupe)
const _etCache = new WeakMap();
function effectiveTags(n) {
  if (!n) return [];
  const meta = n.tags || [], content = n.content || '', sig = meta.join('\u0001');
  const hit = _etCache.get(n);
  if (hit && hit.c === content && hit.s === sig) return hit.t;
  const seen = new Set(), out = [];
  [...meta, ...inlineTags(content)].forEach(t => {
    const k = tagKey(t);
    if (k && !seen.has(k)) { seen.add(k); out.push(String(t).trim().replace(/^#+/, '')); }
  });

}
function hasTag(n, key) { return effectiveTags(n).some(t => tagKey(t) === key); }

function tagIndex() { // key -> { name, count }
  const m = new Map();
  notes.forEach(n => effectiveTags(n).forEach(t => {
    const k = tagKey(t), e = m.get(k);

  }));
  return m;
}
function allTags() {
  return [...tagIndex().values()].map(e => e.name).sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
}

function tagColorOf(t) { return tagColors[tagKey(t)] || null; }
function noteColors(n) { // distinct colours of a note's tags, in tag order
  const out = [];
  effectiveTags(n).forEach(t => { const c = tagColorOf(t); if (c && !out.includes(c)) out.push(c); });
  return out;
}
function stripeGradient(colors) { // up to 3 hard-edged segments; var() keeps it in step with the theme
  const cs = colors.slice(0, 3), step = 100 / cs.length;
  return 'linear-gradient(to bottom, ' + cs.map((c, i) => `var(--tc-${c}) ${(i * step).toFixed(2)}% ${((i + 1) * step).toFixed(2)}%`).join(', ') + ')';
}

/* ---- colour storage: localStorage per user, mirrored to users/{uid}/settings/tagColors (best effort) ---- */

const tcStoreKey = uid => `notes-tag-colors:${uid}`;
const tcDoc = uid => db.collection('users').doc(uid).collection('settings').doc('tagColors');
let tcSyncWarned = false;

function sanitizeTagColors(obj) {
  const out = {};
  if (obj && typeof obj === 'object') Object.entries(obj).forEach(([k, v]) => { const key = tagKey(k); const id = LEGACY_TAG_COLORS[v] || v; if (key && TAG_COLOR_IDS.has(id)) out[key] = id; });
  return out;
}
async function loadTagColors() {
  tagColors = { ...DEFAULT_TAG_COLORS };
  if (!currentUser) return;
  const uid = currentUser.uid;
  let local = null, remote = null;
  try { const raw = lsGet(tcStoreKey(uid)); if (raw) local = sanitizeTagColors(JSON.parse(raw)); } catch (e) { /* ignore a corrupt copy */ }
  try {
    const d = await tcDoc(uid).get();
    if (d.exists) remote = sanitizeTagColors(Object.fromEntries(((d.data() || {}).entries || []).map(e => [e.tag, e.color])));
  } catch (err) { console.warn('tag colours: cloud read failed:', err.code || err.message); }
  const chosen = remote || local;
  if (chosen) { tagColors = chosen; lsSet(tcStoreKey(uid), JSON.stringify(chosen)); }
  if (!remote && local) syncTagColors(true);
}
async function syncTagColors(quiet) {
  if (!currentUser) return;
  const entries = Object.entries(tagColors).map(([tag, color]) => ({ tag, color }));
  try { await tcDoc(currentUser.uid).set({ entries, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }); }
  catch (err) {
    console.warn('tag colours: cloud save failed:', err.code || err.message);
    if (!quiet && !tcSyncWarned) { tcSyncWarned = true; toast('Tag colors are saved on this device only. Deploy the updated firestore.rules to sync them.', { ms: 6000 }); }
  }
}
function setTagColor(key, color) {
  if (!key) return;
  if (color && TAG_COLOR_IDS.has(color)) tagColors[key] = color; else delete tagColors[key];
  if (currentUser) lsSet(tcStoreKey(currentUser.uid), JSON.stringify(tagColors));
  syncTagColors();
  refreshTagColorViews();
}
function refreshTagColorViews() {
  renderTagChips();
  renderNoteList();
  if (activeNote && document.getElementById('tags-row')) { renderTagsRow(); renderPreview(); }
}

function setTagFilter(key) {
  activeTagFilter = (activeTagFilter === key ? null : key);
  renderTagChips();
  renderNoteList();
  if (!activeTagFilter || isMobile()) return; // on mobile the list is a slide-over; opening a note would hide the results
  // open the top note of the filtered list (same order the list shows)
  const terms = val('search').toLowerCase().split(/\s+/).filter(Boolean);
  const first = notes
    .filter(n => hasTag(n, activeTagFilter) && (!terms.length || noteMatches(n, terms)))
    .sort((a, b) => (noteDate(b) || 0) - (noteDate(a) || 0))[0];
  if (first && first.id !== activeNoteId) openNote(first.id);
}

function renderTagChips() {
  const el = document.getElementById('tag-chips');
  el.innerHTML = '';
  const idx = tagIndex();

  const tags = [...idx.entries()].sort((a, b) => a[1].name.toLowerCase().localeCompare(b[1].name.toLowerCase()));

let tcPending = []; // tags added in the popover that nothing uses yet (kept until it closes)
const tcPopEl = () => document.getElementById('tc-pop');

function openTagColors() {
  const pop = tcPopEl();
  tcPending = [];
  pop.innerHTML = '';
  const head = document.createElement('div');

  const h = document.createElement('h2');

  x.onclick = () => closeTagColors();

function closeTagColors(returnFocus = true) {

function renderTagColorsList(focus) {
  const list = document.getElementById('tcp-list');
  if (!list) return;
  const rows = new Map();
  tagIndex().forEach((v, k) => rows.set(k, v));
  Object.keys(tagColors).forEach(k => { if (!rows.has(k)) rows.set(k, { name: k, count: 0 }); });
  tcPending.forEach(t => { const k = tagKey(t); if (!rows.has(k)) rows.set(k, { name: t, count: 0 }); });
  list.innerHTML = '';
  if (!rows.size) {
    const empty = document.createElement('div');
    empty.className = 'tcp-empty';
    empty.textContent = 'No tags yet. Add one above, or tag a note.';
    list.appendChild(empty);
    return;
  }
  [...rows.entries()].sort((a, b) => a[1].name.toLowerCase().localeCompare(b[1].name.toLowerCase())).forEach(([key, { name, count }]) => {
    const row = document.createElement('div');
    row.className = 'tcp-row'; row.dataset.key = key;
    const nm = document.createElement('div');
    nm.className = 'tcp-name';
    const label = document.createElement('span');
    label.textContent = '#' + name;
    const n = document.createElement('span');
    n.className = 'n'; n.textContent = count === 1 ? '1 note' : count + ' notes';
    nm.append(label, n);
    const sw = document.createElement('div');
    sw.className = 'tcp-sw'; sw.setAttribute('role', 'radiogroup'); sw.setAttribute('aria-label', 'Color for #' + name);
    const cur = tagColors[key] || '';
    [...TAG_COLORS, ['', 'No color']].forEach(([id, text]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'sw' + (id ? '' : ' none');
      if (id) b.dataset.tc = id;
      b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', String(cur === id));
      b.setAttribute('aria-label', text); b.title = text;
      b.tabIndex = cur === id ? 0 : -1;
      b.innerHTML = ICONS.check;
      b.onclick = () => {
        if (!id && !tagIndex().has(key) && !tcPending.some(t => tagKey(t) === key)) tcPending.push(name); // keep the row after clearing
        setTagColor(key, id);
        renderTagColorsList({ key });
      };
      b.onkeydown = e => {
        const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
        if (!step) return;
        e.preventDefault();
        const all = [...sw.children];
        all[(all.indexOf(b) + step + all.length) % all.length].click();
      };
      sw.appendChild(b);
    });
    row.append(nm, sw);
    list.appendChild(row);
  });
  if (focus) {
    const b = list.querySelector(`.tcp-row[data-key="${CSS.escape(focus.key)}"] .sw[aria-checked="true"]`);
    if (b) b.focus();
  }
}
document.addEventListener('mousedown', e => {

function noteMatches(n, terms) {
  const hay = (displayTitle(n) + ' ' + (n.content || '') + ' ' + (n.tags || []).join(' ')).toLowerCase();
  return terms.every(t => hay.includes(t));
}
// A window of body text around the first search hit, falling back to the start of the body
function searchSnippet(n, terms) {
  const text = plainText(n.content);
  const lower = text.toLowerCase();
  const hit = terms.map(t => lower.indexOf(t)).filter(i => i >= 0).sort((a, b) => a - b)[0];
  if (hit === undefined) return highlight(bodySnippet(n), terms);
  const start = Math.max(0, hit - 30);
  return (start > 0 ? '…' : '') + highlight(text.slice(start, start + 130), terms);
}

/* ---------- groups (folders) ----------
   A group is a doc in users/{uid}/folders ({ name, order }); a note belongs to one via note.folderId (absent / null = ungrouped).
   One level only. Pinned notes are listed once, in the global Pinned section. Collapse state is per device (localStorage). */

/* multi-select: ⌘/Ctrl-click toggles, Shift-click selects a range, Space toggles from the keyboard. The editor keeps showing
   the note that was opened first; the selection only decides what a drag / "Move to…" acts on. */
const selectedIds = new Set();
let selAnchor = null;
const isMulti = () => selectedIds.size > 1;
function visibleRowIds() { return [...document.querySelectorAll('#note-list .note-row')].filter(r => r.offsetParent !== null).map(r => r.dataset.id); }
function selectedList() { const vis = visibleRowIds(); return [...selectedIds].sort((a, b) => vis.indexOf(a) - vis.indexOf(b)); }
function clearSelection() { if (!selectedIds.size) return; selectedIds.clear(); renderNoteList(); }
function toggleSelect(id) {
  if (!selectedIds.size) {
    if (!activeNoteId) { openNote(id); return; } // nothing open yet: the first note clicked opens and anchors the selection
    selectedIds.add(activeNoteId);
    if (id === activeNoteId) { selAnchor = id; renderNoteList(); return; }
  }
  if (selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
  selAnchor = id;
  renderNoteList();
}
function rangeSelect(id) {
  const from = selAnchor || activeNoteId;
  if (!from) { openNote(id); return; }
  const ids = visibleRowIds(), a = ids.indexOf(from), b = ids.indexOf(id);
  if (a < 0 || b < 0) { toggleSelect(id); return; }
  selectedIds.clear();
  ids.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(x => selectedIds.add(x));
  renderNoteList();
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || !selectedIds.size || gmState) return;
  if (e.target.closest && (e.target.closest('.menu') || e.target.closest('input, textarea'))) return;
  clearSelection();
});

const UNGROUPED = '__ungrouped__'; // key for the Ungrouped section in collapsedFolders (never a Firestore id)
const collapsedFolders = new Set();
try { JSON.parse(lsGet('notes-collapsed-groups') || '[]').forEach(id => collapsedFolders.add(id)); } catch (e) {}
function saveCollapsed() { lsSet('notes-collapsed-groups', JSON.stringify([...collapsedFolders])); }
function foldersCol(uid) { return db.collection('users').doc(uid).collection('folders'); }
function folderById(id) { return id ? folders.find(f => f.id === id) || null : null; }
function noteFolder(n) { return folderById(n.folderId); } // a folderId pointing at a missing group counts as ungrouped
function cleanGroupName(s) { return String(s || '').replace(/\s+/g, ' ').trim().slice(0, 60); }
function cmpFolders(a, b) { return (a.order - b.order) || a.name.localeCompare(b.name); }
function rulesHint(err) { return err && err.code === 'permission-denied' ? ' — deploy the updated firestore.rules (firebase deploy --only firestore:rules)' : ''; }

// items: notes already filtered and sorted newest first. Pinned notes leave their group; a group's count includes them.
function layoutNotes(items, flds) {
  const ids = new Set(flds.map(f => f.id));
  const rest = items.filter(n => !n.pinned);
  return {
    pinned: items.filter(n => n.pinned),
    groups: flds.map(f => ({ folder: f, notes: rest.filter(n => n.folderId === f.id), total: items.filter(n => n.folderId === f.id).length })),
    ungrouped: rest.filter(n => !n.folderId || !ids.has(n.folderId)),
  };
}
// ids in their new order after moving `dragId` before / after `targetId`
function reorderIds(ids, dragId, targetId, after) {
  if (dragId === targetId || !ids.includes(dragId) || !ids.includes(targetId)) return ids.slice();
  const rest = ids.filter(id => id !== dragId);
  rest.splice(rest.indexOf(targetId) + (after ? 1 : 0), 0, dragId);
  return rest;
}

async function loadFolders() {
  try {
    const snap = await foldersCol(currentUser.uid).get();
    folders = snap.docs.map(d => ({ id: d.id, name: cleanGroupName(d.data().name) || 'Untitled group', order: Number(d.data().order) || 0 })).sort(cmpFolders);
  } catch (err) {
    console.error('loadFolders failed:', err.code, err.message);
    folders = [];
    toast(`Couldn't load groups: ${err.code || err.message}${rulesHint(err)}`, { ms: 9000 });
  }
}

async function createFolder(rawName) {
  if (!currentUser) { openModal('auth-modal'); return null; }
  const name = cleanGroupName(rawName);
  if (!name) return null;
  const ref = foldersCol(currentUser.uid).doc();
  const order = folders.reduce((m, f) => Math.max(m, f.order), 0) + 1;
  try {
    await ref.set({ name, order, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
  } catch (err) {
    console.error('createFolder failed:', err.code, err.message);
    toast(`Couldn't create group: ${err.code || err.message}${rulesHint(err)}`, { ms: 9000 });
    return null;
  }
  const f = { id: ref.id, name, order };
  folders.push(f);
  folders.sort(cmpFolders);
  renderNoteList();
  return f;
}

async function renameFolder(id, rawName) {
  const f = folderById(id), name = cleanGroupName(rawName);
  if (!f || !name || name === f.name) return;
  const old = f.name;
  f.name = name;
  renderNoteList();
  try {
    await foldersCol(currentUser.uid).doc(id).update({ name });
  } catch (err) {
    console.error('renameFolder failed:', err.code, err.message);
    f.name = old;
    renderNoteList();
    toast(`Couldn't rename group: ${err.code || err.message}`);
  }
}

// Deleting a group never deletes notes: its notes become ungrouped (the caller has already shown the warning)
async function deleteFolder(id) {
  const f = folderById(id);
  if (!f || !currentUser) return;
  const members = notes.filter(n => n.folderId === id);
  try {
    for (let i = 0; i < members.length; i += 400) {
      const batch = db.batch();
      members.slice(i, i + 400).forEach(n => batch.update(notesCol(currentUser.uid).doc(n.id), { folderId: null })); // updatedAt untouched
      await batch.commit();
    }
    await foldersCol(currentUser.uid).doc(id).delete();
  } catch (err) {
    console.error('deleteFolder failed:', err.code, err.message);
    toast(`Couldn't delete group: ${err.code || err.message}`);
    return;
  }
  members.forEach(n => { n.folderId = null; });
  folders = folders.filter(x => x.id !== id);
  collapsedFolders.delete(id); saveCollapsed();
  renderNoteList();
  toast(`Deleted group “${f.name}”` + (members.length ? ` · ${members.length} note${members.length === 1 ? '' : 's'} ungrouped` : ''));
}

async function moveFolder(dragId, targetId, after) {
  const ids = reorderIds(folders.map(f => f.id), dragId, targetId, after);
  const before = folders.map(f => [f, f.order]);
  folders = ids.map((id, i) => { const f = folderById(id); f.order = i + 1; return f; });
  renderNoteList();
  try {
    const batch = db.batch();
    before.forEach(([f, o]) => { if (f.order !== o) batch.update(foldersCol(currentUser.uid).doc(f.id), { order: f.order }); });
    await batch.commit();
  } catch (err) {
    console.error('moveFolder failed:', err.code, err.message);
    before.forEach(([f, o]) => { f.order = o; });
    folders.sort(cmpFolders);
    renderNoteList();
    toast(`Couldn't reorder groups: ${err.code || err.message}`);
  }
}

// Move notes into a group (or out, with null). Only the field changes, so notes keep their dates and list positions.
async function setNotesFolder(ids, folderId) {
  folderId = folderId || null;
  const moving = ids.map(id => notes.find(n => n.id === id)).filter(n => n && (n.folderId || null) !== folderId);
  if (!moving.length || !currentUser) return;
  const prev = new Map(moving.map(n => [n, n.folderId || null]));
  moving.forEach(n => { n.folderId = folderId; });
  const key = folderById(folderId) ? folderId : UNGROUPED; // keep the open note visible after moving it
  if (collapsedFolders.has(key) && moving.some(n => n.id === activeNoteId)) { collapsedFolders.delete(key); saveCollapsed(); }
  renderNoteList();
  const f = folderById(folderId), where = f ? `“${f.name}”` : 'Ungrouped';
  toast(moving.length === 1 ? `Moved to ${where}` : `Moved ${moving.length} notes to ${where}`);
  try {
    for (let i = 0; i < moving.length; i += 400) {
      const batch = db.batch();
      moving.slice(i, i + 400).forEach(n => batch.update(notesCol(currentUser.uid).doc(n.id), { folderId }));
      await batch.commit();
    }
  } catch (err) {
    console.error('setNotesFolder failed:', err.code, err.message);
    prev.forEach((old, n) => { n.folderId = old; });
    renderNoteList();
    toast(`Couldn't move ${moving.length === 1 ? 'note' : 'notes'}: ${err.code || err.message}`);
  }
}
function setNoteFolder(id, folderId) { return setNotesFolder([id], folderId); }

function toggleUngrouped() {
  if (collapsedFolders.has(UNGROUPED)) collapsedFolders.delete(UNGROUPED); else collapsedFolders.add(UNGROUPED);
  saveCollapsed();
  renderNoteList(); // also drops the now-hidden notes from the selection
  const t = document.querySelector('.ungrouped .ug-toggle');

function isUngroupedHidden(n) { // in the Ungrouped section while it is collapsed (only when groups exist)
  return folders.length > 0 && collapsedFolders.has(UNGROUPED) && !n.pinned && !folderById(n.folderId);
}
function toggleFolder(id) {
  if (collapsedFolders.has(id)) collapsedFolders.delete(id); else collapsedFolders.add(id);
  notes.forEach(n => { if (n.folderId === id && !n.pinned) selectedIds.delete(n.id); }); // collapsed notes can't stay selected
  saveCollapsed();

/* drag & drop (mouse). Touch and keyboard use "Move to group…" in the note's … menu. */
let dragItem = null; // { type: 'note' | 'group', id }
function clearDropMarks() {
  document.querySelectorAll('.drop-target, .drop-before, .drop-after').forEach(el => el.classList.remove('drop-target', 'drop-before', 'drop-after'));
}
function endDrag() {
  dragItem = null;
  clearDropMarks();
  document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
  document.getElementById('note-list').classList.remove('dragging');
}
function startDrag(e, el, item) {
  dragItem = item;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('application/x-notes-drag', item.type === 'note' ? item.ids.join(',') : item.id);
  el.classList.add('dragging');
  if (item.type === 'note' && item.ids.length > 1) {
    item.ids.forEach(id => document.querySelectorAll(`.note-row[data-id="${id}"]`).forEach(r => r.classList.add('dragging')));
    const ghost = document.createElement('div'); // drag image: "3 notes"

    document.body.appendChild(ghost);

  }
  document.getElementById('note-list').classList.add('dragging');
}
(function setupDnD() {
  const list = document.getElementById('note-list');
  const isAfter = (grp, y) => { const r = grp.querySelector('.grp-head').getBoundingClientRect(); return y > r.top + r.height / 2; };
  list.addEventListener('dragover', e => {
    if (!dragItem) return;
    const grp = e.target.closest('.grp'), zone = e.target.closest('.ungrouped');
    clearDropMarks();
    if (dragItem.type === 'note') {
      const t = grp || zone;
      if (!t) return; // not a drop target (e.g. the Pinned section)
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      t.classList.add('drop-target');
    } else if (grp && grp.dataset.id !== dragItem.id) {
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      grp.classList.add(isAfter(grp, e.clientY) ? 'drop-after' : 'drop-before');
    }
  });
  list.addEventListener('dragleave', e => { if (!list.contains(e.relatedTarget)) clearDropMarks(); });
  list.addEventListener('drop', e => {
    if (!dragItem) return;
    e.preventDefault();
    const item = dragItem, grp = e.target.closest('.grp'), zone = e.target.closest('.ungrouped');
    const after = grp ? isAfter(grp, e.clientY) : false;
    endDrag();
    if (item.type === 'note' && (grp || zone)) { selectedIds.clear(); setNotesFolder(item.ids, grp ? grp.dataset.id : null); }
    else if (grp) moveFolder(item.id, grp.dataset.id, after);
  });
})();

/* ---------- note list / tags / search: sidebar rendering ---------- */

function noteRow(n, { terms = [], pinned = false, showFolder = false } = {}) {
  const row = document.createElement('div'); // a div (role=button): rows are draggable and hold their own unpin button
  row.setAttribute('role', 'button');
  row.tabIndex = 0;
  row.draggable = true;
  row.className = 'note-row' + (n.id === activeNoteId ? ' active' : '') + (isMulti() && selectedIds.has(n.id) ? ' selected' : '');
  row.dataset.id = n.id;
  const tagNames = effectiveTags(n), tagCols = noteColors(n);
  if (tagCols.length) { row.classList.add('tagged'); row.style.setProperty('--tc-stripe', stripeGradient(tagCols)); }
  if (isMulti()) row.setAttribute('aria-selected', String(selectedIds.has(n.id)));
  const snippet = terms.length ? searchSnippet(n, terms) : escapeHtml(bodySnippet(n));
  const f = showFolder ? noteFolder(n) : null;
  row.innerHTML =
    `<span class="r1">${pinned ? `<span class="pin-btn" role="button" tabindex="0" title="Unpin" aria-label="Unpin note">${ICONS.pin.replace('class="i"', 'class="i p"')}${ICONS.x}</span>` : ''}<span class="t">${highlight(displayTitle(n), terms)}</span>` +
    (f ? `<span class="g" title="Group: ${escapeHtml(f.name)}">${escapeHtml(f.name)}</span>` : '') +
    `<span class="d">${escapeHtml(formatListDate(noteDate(n)))}</span></span>` +
    (snippet ? `<span class="s">${snippet}</span>` : `<span class="s none">${n.content && n.content.trim() ? '' : 'Empty note'}</span>`) +
    (tagNames.length ? `<span class="sr-only">Tags: ${escapeHtml(tagNames.join(', '))}</span>` : '');
  row.onclick = e => {
    if (e.metaKey || e.ctrlKey) toggleSelect(n.id);
    else if (e.shiftKey) rangeSelect(n.id);
    else openNote(n.id);
  };
  row.onkeydown = e => {
    if (e.target !== row) return;
    if (e.key === 'Enter') { e.preventDefault(); openNote(n.id); }
    else if (e.key === ' ') { e.preventDefault(); toggleSelect(n.id); }
  };
  row.ondragstart = e => startDrag(e, row, { type: 'note', ids: isMulti() && selectedIds.has(n.id) ? selectedList() : [n.id] });
  row.ondragend = endDrag;
  const pinBtn = row.querySelector('.pin-btn');
  if (pinBtn) { // a span: nested buttons aren't valid HTML
    pinBtn.onclick = e => { e.stopPropagation(); setPinned(n.id, false); };
    pinBtn.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); setPinned(n.id, false); } };
  }
  return row;
}

function renderNoteListInner() {

  if (L.pinned.length) {
    list.appendChild(label('Pinned'));

    body.appendChild(s);
