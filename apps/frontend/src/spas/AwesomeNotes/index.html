}

/* ---------- one-time cleanup of the retired "Link name" field ---------- */

// Notes used to have an optional "Link name" (userTitle) that [[links]] could use instead of the title.
// Before that field is deleted, any [[link]] written with a link name is rewritten to the note's title so none break.
function planLinkNameMigration(list) {
  const remap = new Map(); // lowercased old link name -> title to link to now
  list.forEach(n => {
    const old = String(n.userTitle || '').trim();
    if (!old || /^New Note \(\d+\)$/.test(old)) return; // empty or the old auto-generated placeholder
    const t = titleLine(n.content), k = old.toLowerCase();
    if (!t.text || t.text.toLowerCase() === k || t.full.toLowerCase() === k || remap.has(k)) return; // already resolves by title
    remap.set(k, t.text);
  });
  let linkCount = 0, fieldCount = 0;
  const updates = [];
  list.forEach(n => {
    const had = 'userTitle' in n;
    let content = n.content || '';
    if (remap.size) {
      content = content.replace(/\[\[([^\]\n]+)\]\]/g, (m, name) => {
        const to = remap.get(name.trim().toLowerCase());
        if (!to) return m;
        linkCount++;
        return `[[${to}]]`;
      });
    }
    const changed = content !== (n.content || '');
    if (had) fieldCount++;
    if (had || changed) updates.push({ id: n.id, dropField: had, content: changed ? content : null });
  });
  return { updates, linkCount, fieldCount };
}

let linkNameMigrationDeclined = false;
async function migrateLinkNames() {
  if (!currentUser || linkNameMigrationDeclined) return;
  const plan = planLinkNameMigration(notes);
  if (!plan.updates.length) return;
  const { fieldCount: nf, linkCount: nl } = plan;
  if (!confirm(`The "Link name" field has been removed from Notes.\n\nDelete it from ${nf} note${nf === 1 ? '' : 's'}?` +
      (nl ? `\n\n${nl} [[link]]${nl === 1 ? '' : 's'} that used a link name will be rewritten to the note's title so none break.` : ''))) {
    linkNameMigrationDeclined = true; // asked again next time the app loads; the leftover field is ignored
    return;
  }
  try {
    for (let i = 0; i < plan.updates.length; i += 400) {
      const batch = db.batch();
      plan.updates.slice(i, i + 400).forEach(u => {
        const data = {};
        if (u.dropField) data.userTitle = firebase.firestore.FieldValue.delete();
        if (u.content !== null) data.content = u.content; // updatedAt is left alone so the list order doesn't change
        batch.update(notesCol(currentUser.uid).doc(u.id), data);
      });
      await batch.commit();
    }
  } catch (err) {
    console.error('migrateLinkNames failed:', err.code, err.message);
    toast(`Couldn't remove link names: ${err.code || err.message}`);
    return;
  }
  plan.updates.forEach(u => {
    const n = notes.find(n => n.id === u.id);
    if (!n) return;
    delete n.userTitle;
    if (u.content !== null) n.content = u.content;
  });
  renderNoteList();
  if (activeNote) renderRelated();
  toast(`Removed link names` + (nl ? ` · updated ${nl} link${nl === 1 ? '' : 's'}` : ''));
}

/* ---------- CRUD ---------- */

async function createNewNote(folderId = null) {
  if (!currentUser) { openModal('auth-modal'); return; }
  if (typeof folderId !== 'string' || !folderById(folderId)) folderId = null; // also ignores click events
  const ref = notesCol(currentUser.uid).doc();
  const data = {
    title: defaultTitle(new Date()), content: '', tags: [], public: false, pinned: false, folderId,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
  };
  try {
    await ref.set(data);
  } catch (err) {
    console.error('createNewNote failed:', err.code, err.message);
    toast(`Couldn't create note: ${err.code || err.message}`);
    return;
  }
  notes.unshift({ id: ref.id, ...data, createdAt: new Date(), updatedAt: new Date() });
  if (viewMode === 'preview') viewMode = 'edit';
  openNote(ref.id, { focus: true }); // also expands the group if it was collapsed
}

async function createNoteWithTitle(name, { open = true } = {}) {
  if (!currentUser) return null;
  name = name.trim();
  if (!name) return null;
  const ref = notesCol(currentUser.uid).doc();
  const data = {
    title: defaultTitle(new Date()), content: `# ${name}\n\n`, tags: [], public: false, pinned: false, folderId: null,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
  };
  try {
    await ref.set(data);
  } catch (err) {
    console.error('createNoteWithTitle failed:', err.code, err.message);
    toast(`Couldn't create note: ${err.code || err.message}`);
    return null;
  }
  const note = { id: ref.id, ...data, createdAt: new Date(), updatedAt: new Date() };
  notes.unshift(note);
  renderNoteList();
  if (open) openNote(ref.id, { focus: true });
  return note;
}

function openNote(id, opts = {}) {
  const n = notes.find(n => n.id === id);
  if (!n) return;
  selectedIds.clear(); selAnchor = id;
  if (n.folderId && !n.pinned && collapsedFolders.has(n.folderId)) { collapsedFolders.delete(n.folderId); saveCollapsed(); } // reveal it in its group
  if (isUngroupedHidden(n)) { collapsedFolders.delete(UNGROUPED); saveCollapsed(); } // ...or in the Ungrouped section
  if (dirty && activeNoteId && activeNoteId !== id) saveActiveNote(); // flush edits to the note we're leaving
  activeNoteId = id;
  activeNote = { title: n.title || '', content: n.content || '', tags: n.tags ? [...n.tags] : [], public: !!n.public, pinned: !!n.pinned };
  dirty = false;
  renderNoteList();
  renderEditor();
  renderRelated();
  if (opts.focus && viewMode !== 'preview') document.getElementById('md-input').focus();
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('related-pane').classList.remove('open');
}

function showEmptyEditor(msg) {
  const pane = document.getElementById('editor-pane');
  pane.className = 'empty-state';
  pane.innerHTML = `<div>${escapeHtml(msg)}</div>`;
  closeLinkPicker();
  setRelatedState(false);
}

function setSaveState(s) {
  const el = document.getElementById('save-status');
  if (!el) return;
  el.dataset.state = s;
  el.textContent = { saving: 'Saving…', saved: 'Saved', error: 'Save failed' }[s] || '';
}

function scheduleSave() {
  dirty = true;
  setSaveState('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveActiveNote, 900);
}

async function saveActiveNote() {
  clearTimeout(saveTimer); saveTimer = null;
  if (!activeNoteId || !currentUser) return;
  const id = activeNoteId;
  dirty = false;
  const data = {
    title: activeNote.title, content: activeNote.content, tags: activeNote.tags,
    public: activeNote.public, pinned: activeNote.pinned,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
  };
  // Shared view can't read the user's profile, so store a display name on the note itself (no email address)
  if (activeNote.public) data.authorName = currentUser.displayName || (currentUser.email || '').split('@')[0] || '';
  try {
    await notesCol(currentUser.uid).doc(id).update(data);
  } catch (err) {
    console.error('saveActiveNote failed:', err.code, err.message);
    dirty = true;
    if (id === activeNoteId) setSaveState('error');
    toast(`Couldn't save: ${err.code || err.message}`);
    return;
  }
  const cached = notes.find(n => n.id === id);
  if (cached) Object.assign(cached, data, { updatedAt: new Date() });
  if (id === activeNoteId) {
    if (!dirty) setSaveState('saved');
    renderRelated();
  }
  renderNoteList();
  renderTagChips();
  // inline #tags changed: refresh the read-only pills (not while the tag box is in use)
  if (id === activeNoteId && activeNote && document.getElementById('tags-row') && document.activeElement && document.activeElement.id !== 'tag-input'
      && inlineTags(activeNote.content).join('\u0001') !== inlineSig) renderTagsRow();
}
window.addEventListener('pagehide', () => { if (dirty) saveActiveNote(); });

// Delete is deferred: the note disappears at once, and the Firestore/Storage delete only runs when the undo window closes.
function deleteActiveNote() {
  if (!activeNoteId) return;
  commitPendingDelete();
  clearTimeout(saveTimer); saveTimer = null; dirty = false;
  const note = notes.find(n => n.id === activeNoteId);
  if (!note) return;
  Object.assign(note, activeNote); // keep unsaved edits so Undo restores them
  notes = notes.filter(n => n !== note);
  activeNoteId = null; activeNote = null;
  renderNoteList();
  renderTagChips();
  showEmptyEditor('Note deleted. Select another note, or create a new one.');
  const p = { note, timer: setTimeout(() => commitPendingDelete(), 7000) };
  pendingDelete = p;
  toast('Note deleted', { action: 'Undo', ms: 7000, onAction: () => undoDelete(p) });
}
function undoDelete(p) {
  if (pendingDelete !== p) return;
  clearTimeout(p.timer);
  pendingDelete = null;
  notes.push(p.note);
  renderNoteList();
  renderTagChips();
  openNote(p.note.id);
}
async function commitPendingDelete() {
  const p = pendingDelete;
  if (!p) return;
  clearTimeout(p.timer);
  pendingDelete = null;
  try {
    await deleteNoteFiles(p.note.id);
  } catch (err) {
    console.warn('Some attached files could not be deleted:', err.code, err.message);
  }
  try {
    await notesCol(currentUser.uid).doc(p.note.id).delete();
  } catch (err) {
    console.error('delete failed:', err.code, err.message);
    toast(`Couldn't delete: ${err.code || err.message}`);
    notes.push(p.note);
    renderNoteList();
    renderTagChips();
  }
}

async function deleteNoteFiles(noteId) {
  const folderRef = storage.ref(`users/${currentUser.uid}/notes/${noteId}`);
  const listing = await folderRef.listAll();
  await Promise.all(listing.items.map(item =>
    item.delete().catch(e => console.warn('Could not delete file', item.fullPath, e.code || e.message))
  ));
}

// Pin / unpin any note (the open one saves with its other edits; others get a direct field update, which leaves their date alone)
async function setPinned(id, value) {
  const n = notes.find(n => n.id === id);
  if (!n || !currentUser) return;
  n.pinned = value;
  const isActive = id === activeNoteId && activeNote;
  if (isActive) activeNote.pinned = value;
  renderNoteList();
  refreshMenuState();
  toast(value ? 'Pinned' : 'Unpinned');
  if (isActive) { scheduleSave(); return; }
  try {
    await notesCol(currentUser.uid).doc(id).update({ pinned: value });
  } catch (err) {
    console.error('setPinned failed:', err.code, err.message);
    n.pinned = !value;
    renderNoteList();
    toast(`Couldn't ${value ? 'pin' : 'unpin'}: ${err.code || err.message}`);
  }
}
function togglePin() {
  if (activeNote) setPinned(activeNoteId, !activeNote.pinned);
}

  `;
  const ta = document.getElementById('md-input');
  ta.value = activeNote.content;
  ta.addEventListener('input', onContentInput);
  ta.addEventListener('paste', onEditorPaste);
  ta.addEventListener('keydown', onEditorKeydown);
  ta.addEventListener('click', updateLinkPicker);
  ta.addEventListener('blur', () => setTimeout(closeLinkPicker, 120));
  ta.addEventListener('keyup', e => { if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) updateLinkPicker(); });
  renderTagsRow();
  renderPreview();
  renderShareStatus();
  refreshMenuState();
  document.querySelectorAll('[data-needs-editor]').forEach(b => b.disabled = viewMode === 'preview');
}

function setViewMode(m) {
  viewMode = m;
  lsSet('notes-view-mode', m);
  const wrap = document.querySelector('.editor-wrap');
  if (!wrap) return;
  wrap.dataset.mode = m;
  document.getElementById('edit-area').dataset.mode = m;
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
  document.querySelectorAll('[data-needs-editor]').forEach(b => b.disabled = m === 'preview');
  closeLinkPicker();
  renderPreview();
  if (m === 'edit') document.getElementById('md-input').focus();
}

function onContentInput(e) { activeNote.content = e.target.value; renderPreview(); scheduleSave(); updateLinkPicker(); }

let inlineSig = ''; // inline #tags currently shown in the tags row
function renderTagsRow() {
  const el = document.getElementById('tags-row');
  el.innerHTML = '';
  activeNote.tags.forEach((t, i) => {
    const pill = document.createElement('span');
    pill.className = 'tag-pill';
    const c = tagColorOf(t);
    if (c) pill.dataset.tc = c;
    pill.innerHTML = `${escapeHtml(t)} <button aria-label="Remove tag ${escapeHtml(t)}">✕</button>`;
    pill.querySelector('button').onclick = () => { activeNote.tags.splice(i, 1); renderTagsRow(); scheduleSave(); };
    el.appendChild(pill);
  });
  // #tags typed in the note text: shown here too (read-only; edit them in the text)
  const metaKeys = new Set(activeNote.tags.map(tagKey));
  const inl = inlineTags(activeNote.content);
  inlineSig = inl.join('\u0001');
  inl.filter(t => !metaKeys.has(tagKey(t))).forEach(t => {
    const pill = document.createElement('span');
    pill.className = 'tag-pill inline';
    pill.title = 'From #' + t + ' in the note text';
    const c = tagColorOf(t);
    if (c) pill.dataset.tc = c;
    pill.textContent = '#' + t;
    el.appendChild(pill);
  });
  const wrap = document.createElement('span');
  wrap.id = 'tag-input-wrap';
  const input = document.createElement('input');
  input.id = 'tag-input';
  input.placeholder = '+ add tag';
  input.autocomplete = 'off';
  input.name = 'note-tag';
  input.setAttribute('aria-label', 'Add tag');
  input.setAttribute('data-lpignore', 'true');
  input.setAttribute('data-1p-ignore', '');
  input.setAttribute('data-form-type', 'other');
  const menu = document.createElement('div');
  menu.id = 'tag-suggest';
  menu.hidden = true;
  let items = [], hi = -1;

  const addTag = t => {
    t = t.trim().replace(/^#+/, '');
    if (!t) return;
    if (!activeNote.tags.some(x => x.toLowerCase() === t.toLowerCase())) activeNote.tags.push(t);
    renderTagsRow();
    scheduleSave();
    document.getElementById('tag-input').focus();
  };
  const refresh = () => {
    const q = input.value.trim().toLowerCase();
    const have = new Set(activeNote.tags.map(t => t.toLowerCase()));
    const known = new Set([...allTags(), ...activeNote.tags]);
    items = [...known].filter(t => !have.has(t.toLowerCase()) && t.toLowerCase().includes(q)).sort();
    hi = -1;
    menu.innerHTML = '';
    items.forEach(t => {
      const row = document.createElement('div');
      row.className = 'tag-suggest-item';
      row.textContent = t;
      row.onmousedown = e => { e.preventDefault(); addTag(t); }; // mousedown so blur doesn't close the menu first
      menu.appendChild(row);
    });
    menu.hidden = !items.length;
  };
  const highlightItem = () => [...menu.children].forEach((c, i) => c.classList.toggle('hi', i === hi));

  input.oninput = refresh;
  input.onfocus = refresh;
  input.onblur = () => { menu.hidden = true; };
  input.onkeydown = e => {
    if (e.key === 'ArrowDown' && items.length) { e.preventDefault(); hi = (hi + 1) % items.length; highlightItem(); }
    else if (e.key === 'ArrowUp' && items.length) { e.preventDefault(); hi = (hi - 1 + items.length) % items.length; highlightItem(); }
    else if (e.key === 'Escape') { menu.hidden = true; }
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (hi >= 0) addTag(items[hi]); else addTag(input.value);
    }
  };
  wrap.append(input, menu);
  el.appendChild(wrap);
}

function wrapSelection(before, after) {
  const ta = document.getElementById('md-input');
  const [s, e] = [ta.selectionStart, ta.selectionEnd];
  const val = ta.value;
  ta.value = val.slice(0, s) + before + val.slice(s, e) + after + val.slice(e);
  activeNote.content = ta.value;
  ta.focus();
  ta.selectionStart = s + before.length;
  ta.selectionEnd = e + before.length;
  renderPreview();
  scheduleSave();
  updateLinkPicker();
}

/* ---------- markdown rendering ---------- */

marked.setOptions({ gfm: true, breaks: true }); // tables, task lists, strikethrough, autolinks; single newline = line break

// Be lenient about emphasis padded with spaces/newlines ("** text **"), which CommonMark would show literally.
// Code fences and inline code are left untouched.
function normalizeMarkdown(src) {
  return src.split(/(```[\s\S]*?```|~~~[\s\S]*?~~~|`[^`\n]*`)/g).map((part, i) => {
    if (i % 2) return part;
    return part
      .replace(/(\*\*|__)[ \t]*\n?[ \t]+([^*_\n][^*_]*?)[ \t]*\n?[ \t]*\1(?!\*)/g, (m, d, t) => d + t.trim() + d)
      .replace(/(\*\*|__)[ \t]*\n?[ \t]*([^*_\n][^*_]*?)[ \t]+\1(?!\*)/g, (m, d, t) => d + t.trim() + d);
  }).join('');
}

function renderMarkdown(src) {
  return DOMPurify.sanitize(marked.parse(normalizeMarkdown(src)), { ADD_ATTR: ['data-note-title', 'target'] });
}

function renderPreview() {
  if (viewMode === 'edit') return; // preview is hidden; rendered when the mode changes
  const el = document.getElementById('md-preview');
  const withLinks = activeNote.content.replace(/\[\[([^\]]+)\]\]/g, (m, title) => {
    const found = findNoteByLinkName(title);
    const cls = found ? 'note-link' : 'note-link missing';
    return `<a href="#" class="${cls}" data-note-title="${escapeHtml(title)}">${escapeHtml(title)}</a>`;
  });
  el.innerHTML = renderMarkdown(withLinks);
  openLinksInNewTab(el);
  decorateInlineTags(el);
  el.querySelectorAll('a.note-link').forEach(a => {
    a.addEventListener('click', ev => {
      ev.preventDefault();
      const title = a.getAttribute('data-note-title');
      const found = findNoteByLinkName(title);
      if (found) { openNote(found.id); }
      else if (confirm(`No note titled "${title}" yet. Create it?`)) { createNoteWithTitle(title); }
    });
  });
}

// Wrap #tags in the rendered preview (skipping code, links and existing tag spans); click one to filter the sidebar by it
function decorateInlineTags(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: nd => nd.nodeValue.includes('#') && !nd.parentElement.closest('code, pre, a, script, style, .md-tag') ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT,
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(nd => {
    const text = nd.nodeValue, re = new RegExp(INLINE_TAG_RE.source, 'gu');
    const frag = document.createDocumentFragment();
    let last = 0, m, found = false;
    while ((m = re.exec(text))) {
      const name = inlineTagName(m[2]);
      if (!name) continue;
      found = true;
      const hashAt = m.index + m[1].length;
      frag.append(text.slice(last, hashAt));
      const span = document.createElement('span');
      const key = name.toLowerCase();
      span.className = 'md-tag';
      span.dataset.tag = key;
      if (tagColors[key]) span.dataset.tc = tagColors[key];
      span.setAttribute('role', 'button');
      span.tabIndex = 0;
      span.title = 'Show notes tagged #' + name;
      span.textContent = '#' + name;
      span.onclick = () => setTagFilter(key);
      span.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setTagFilter(key); } };
      frag.append(span);
      last = hashAt + 1 + name.length;
    }
    if (!found) return;
    frag.append(text.slice(last));
    nd.replaceWith(frag);
  });
}

function openLinksInNewTab(root) {
  root.querySelectorAll('a[href]:not(.note-link)').forEach(a => {
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
  });
}

/* ---------- [[ note picker ---------- */

let picker = null; // { start, items, hi } while open

// Pixel position of a caret inside a textarea, measured with a hidden mirror element
function caretCoords(ta, pos) {
  const cs = getComputedStyle(ta);
  const m = document.createElement('div');
  ['fontFamily', 'fontSize', 'fontWeight', 'fontStyle', 'letterSpacing', 'lineHeight', 'wordSpacing', 'textIndent', 'tabSize',
    'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft'].forEach(p => { m.style[p] = cs[p]; });
  Object.assign(m.style, { position: 'fixed', visibility: 'hidden', top: '0', left: '0', whiteSpace: 'pre-wrap',
    overflowWrap: 'break-word', boxSizing: 'border-box', border: '0', width: ta.clientWidth + 'px' });
  m.textContent = ta.value.slice(0, pos);
  const span = document.createElement('span');
  span.textContent = '​';
  m.appendChild(span);
  document.body.appendChild(m);
  const r = ta.getBoundingClientRect();
  const lh = parseFloat(cs.lineHeight) || parseFloat(cs.fontSize) * 1.5;
  const out = { left: r.left + ta.clientLeft + span.offsetLeft - ta.scrollLeft, top: r.top + ta.clientTop + span.offsetTop - ta.scrollTop, lh };
  m.remove();
  return out;
}

function updateLinkPicker() {
  const ta = document.getElementById('md-input');
  if (!ta || viewMode === 'preview' || ta.selectionStart !== ta.selectionEnd) return closeLinkPicker();
  const pos = ta.selectionStart;
  const before = ta.value.slice(0, pos);
  const start = before.lastIndexOf('[[');
  if (start === -1) return closeLinkPicker();
  const q = before.slice(start + 2);
  if (/[\]\n]/.test(q) || q.length > 60) return closeLinkPicker();
  const k = q.trim().toLowerCase();
  const cands = notes
    .filter(n => n.id !== activeNoteId)
    .map(n => ({ note: n, name: linkName(n) }))
    .filter(c => c.name && (!k || c.name.toLowerCase().includes(k) || displayTitle(c.note).toLowerCase().includes(k)));
  const starts = c => (c.name.toLowerCase().startsWith(k) ? 1 : 0);
  cands.sort((a, b) => starts(b) - starts(a) || (noteDate(b.note) || 0) - (noteDate(a.note) || 0));
  const items = cands.slice(0, 8);
  if (k && !cands.some(c => c.name.toLowerCase() === k)) items.push({ create: true, name: q.trim() });
  if (!items.length) return closeLinkPicker();
  picker = { start, items, hi: 0 };
  renderLinkPicker(ta, pos);
}

function renderLinkPicker(ta, pos) {
  const el = document.getElementById('link-picker');
  el.innerHTML = '';
  picker.items.forEach((it, i) => {
    const row = document.createElement('div');
    row.className = 'lp-item' + (it.create ? ' create' : '') + (i === picker.hi ? ' hi' : '');
    row.setAttribute('role', 'option');
    row.setAttribute('aria-selected', String(i === picker.hi));
    row.innerHTML = it.create
      ? `<span class="t">+ Create “${escapeHtml(it.name)}”</span>`
      : `<span class="t">${escapeHtml(it.name)}</span><span class="s">${escapeHtml(bodySnippet(it.note, 80))}</span>`;
    row.onmousedown = e => { e.preventDefault(); pickLink(it); }; // mousedown so the textarea keeps focus
    el.appendChild(row);
  });
  el.hidden = false;
  const c = caretCoords(ta, pos);
  const w = el.offsetWidth, h = el.offsetHeight;
  const left = Math.max(8, Math.min(c.left, window.innerWidth - w - 8));
  let top = c.top + c.lh + 4;
  if (top + h > window.innerHeight - 8) top = Math.max(8, c.top - h - 4);
  el.style.left = left + 'px';
  el.style.top = top + 'px';
  const hi = el.children[picker.hi];
  if (hi) hi.scrollIntoView({ block: 'nearest' });
}

function closeLinkPicker() {
  picker = null;
  const el = document.getElementById('link-picker');
  if (el) el.hidden = true;
}

async function pickLink(item) {
  const ta = document.getElementById('md-input');
  const { start } = picker;
  const pos = ta.selectionStart;
  closeLinkPicker();
  let name = item.name;
  if (item.create) {
    const created = await createNoteWithTitle(item.name, { open: false });
    if (!created) return;
    name = linkName(created);
    toast(`Created “${name}”`);
  }
  if (ta.value.slice(start, start + 2) !== '[[') return;
  const hasClose = ta.value.slice(pos, pos + 2) === ']]';
  ta.setRangeText(name + (hasClose ? '' : ']]'), start + 2, pos, 'end');
  if (hasClose) ta.selectionStart = ta.selectionEnd = start + 2 + name.length + 2;
  activeNote.content = ta.value;
  ta.focus();
  renderPreview();
  scheduleSave();
}

/* ---------- related notes: backlinks, unlinked mentions, similar ---------- */

const STOP = new Set(('the and for are but not you all can had her was one our out has have this that with from they will would there their what about which when your said each she how been into more some than them then these those were also just only over such very much most other make like time use may any its did get got let who why too yes').split(' '));
const kwCache = new Map(); // note id -> { content, tags, set }

// Most frequent meaningful words in a note (title included), cached per note content
function keywordSet(n) {
  const hit = kwCache.get(n.id);
  if (hit && hit.content === n.content) return hit.set;
  const counts = new Map();
  (plainText(n.content).toLowerCase().match(/[\p{L}][\p{L}\p{N}'-]{3,}/gu) || []).forEach(w => {
    if (!STOP.has(w)) counts.set(w, (counts.get(w) || 0) + 1);
  });
  const set = new Set([...counts].sort((a, b) => b[1] - a[1] || b[0].length - a[0].length).slice(0, 30).map(e => e[0]));
  kwCache.set(n.id, { content: n.content, set });
  return set;
}

function contextSnippet(content, idx, len) {
  const flat = s => s.replace(/\s+/g, ' ');
  const pre = flat(content.slice(Math.max(0, idx - 50), idx));
  const post = flat(content.slice(idx + len, idx + len + 70));
  return `${idx > 50 ? '…' : ''}${escapeHtml(pre)}<mark>${escapeHtml(flat(content.slice(idx, idx + len)))}</mark>${escapeHtml(post)}…`;
}

/* ---------- semantic similarity: on-device embeddings, chunk level ----------
   Each bullet / paragraph is embedded on its own (a note is a list of unrelated items, so one vector per note
   would average them into mush). A note is "similar" when its best chunk matches one of ours, and that matching
   chunk is shown as the reason. Runs in a Web Worker (transformers.js + a small model from a CDN); note text
   never leaves the browser. Vectors are cached in IndexedDB by content hash. Until the model is ready (or if it
   fails to load) the keyword scorer in computeRelated() is used instead. */

const SEM = {
  MODEL: 'Xenova/all-MiniLM-L6-v2',
  LIB: 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1',
  MIN: 0.5,          // best chunk-pair cosine needed to count as "similar" (tune with relatedDebug())
  MAX_CHUNK: 400,    // chars per chunk
  MAX_CHUNKS: 200,   // chunks per note
  BATCH: 32,
  enabled: (() => {
    const pref = lsGet('notes-semantic');
    return pref === '1' || (pref !== '0' && !(navigator.connection && navigator.connection.saveData));
  })(),
  state: 'idle',     // idle | loading | ready | error
  error: '', progress: 0, done: 0, total: 0,
  worker: null, ready: null, readyCtl: null, reqs: new Map(), reqId: 0,
  vecs: new Map(),        // chunk key -> Float32Array (L2-normalised, so dot product = cosine)
  chunkCache: new Map(),  // note id -> { content, chunks }
  indexing: null, again: false, pruned: false, timer: null,
};

// cyrb53 string hash -> short key
function semHash(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 2654435761);
    h2 = Math.imul(h2 ^ c, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
function semKey(text) { return SEM.MODEL.split('/').pop() + ':' + semHash(text); }

// A pasted URL says nothing to an embedding model; its host + slug words do.
function semUrlWords(s) {
  return s.replace(/https?:\/\/(?:www\.)?([^\/\s)]+)(\/[^\s)]*)?/g, (m, host, path) => {
    let words = '';
    if (path) {
      const segs = path.split(/[?#]/)[0].split('/').filter(Boolean).slice(-2);
      words = segs.map(x => { try { return decodeURIComponent(x); } catch (e) { return x; } })
        .join(' ').replace(/\.(html?|php|aspx?)$/i, '').replace(/[-_+.]+/g, ' ').replace(/\b\d+\b/g, ' ');
    }
    return (host + ' ' + words).replace(/\s+/g, ' ').trim();
  });
}

// Split a note into one chunk per list item / paragraph. A list item is embedded together with its parent item
// and the nearest sub-heading ("Add figure for: base case bar…"), so short bullets keep their context.
// The note's title line is not a chunk and not used as context (titles like "To Do Items" are generic),
// unless it is the only text in the note.
function semChunkText(content) {
  const out = [];
  const titleIdx = titleLine(content).idx;
  let inFence = false, heading = '', para = [], stack = [], titleRaw = '';
  const push = (raw, parent) => {
    const text = plainText(semUrlWords(raw)).slice(0, SEM.MAX_CHUNK);
    if (text.length < 8) return null;
    const ctx = [heading, parent].filter(Boolean).join(' › ');
    const c = { text, embed: ctx ? ctx + ': ' + text : text };
    out.push(c);
    return c;
  };
  const flush = () => { if (para.length) { push(para.join(' '), ''); para = []; } };
  (content || '').split('\n').forEach((raw, i) => {
    if (/^\s*(```|~~~)/.test(raw)) { flush(); inFence = !inFence; return; }
    if (inFence) return;
    if (!raw.trim()) { flush(); return; }
    const h = /^\s{0,3}#{1,6}\s+(.*)$/.exec(raw);
    if (h) { flush(); stack = []; if (i !== titleIdx) heading = plainText(h[1]); return; }
    if (i === titleIdx) { titleRaw = raw; return; }
    const b = /^(\s*)(?:[-*+]|\d+[.)])\s+(.*)$/.exec(raw);
    if (b) {
      flush();
      const indent = b[1].replace(/\t/g, '    ').length;
      while (stack.length && stack[stack.length - 1].indent >= indent) stack.pop();
      const top = stack.length ? stack[stack.length - 1] : null;
      if (top && top.chunk) top.chunk.hasChild = true;
      const item = b[2].replace(/^\[[ xX]\]\s+/, '');
      stack.push({ indent, text: plainText(semUrlWords(item)).slice(0, 120), chunk: null });
      stack[stack.length - 1].chunk = push(item, top ? top.text : '');
      return;
    }
    stack = [];
    para.push(raw.trim().replace(/^>\s?/, ''));
  });
  flush();
  if (!out.length && titleRaw) push(titleRaw.replace(/^\s*(?:[-*+]|\d+[.)])\s+/, ''), ''); // a one-line note is its own chunk
  // a short list item that only introduces sub-items ("Add figure for") is context, not a chunk of its own
  return out.filter(c => !(c.hasChild && c.text.length < 25)).slice(0, SEM.MAX_CHUNKS);
}

// Chunks of a note ({ id, content }), cached until its content changes
function semChunks(n) {
  const hit = SEM.chunkCache.get(n.id);
  if (hit && hit.content === n.content) return hit.chunks;
  const chunks = semChunkText(n.content || '');
  chunks.forEach(c => { c.key = semKey(c.embed); });
  SEM.chunkCache.set(n.id, { content: n.content, chunks });
  return chunks;
}

// All notes, with the open note's unsaved edits applied
function semLiveNotes() {
  return notes.map(n => (n.id === activeNoteId && activeNote) ? { ...n, content: activeNote.content, tags: activeNote.tags } : n);
}

function semDot(a, b) {
  if (a.length !== b.length) return 0;
  let s = 0;
  for (let i = 0; i < a.length; i++) s += a[i] * b[i];
  return s;
}

// Notes similar to `me`: best chunk-pair cosine, a small bonus for extra independent matches and shared tags
function semSimilar(me, others, exclude, min = SEM.MIN) {
  const mine = semChunks(me).filter(c => SEM.vecs.has(c.key));
  if (!mine.length) return [];
  const myVecs = mine.map(c => SEM.vecs.get(c.key));
  const myTags = new Set(effectiveTags(me).map(t => t.toLowerCase()));
  const out = [];
  for (const n of others) {
    if (exclude && exclude.has(n.id)) continue;
    const theirs = semChunks(n).filter(c => SEM.vecs.has(c.key));
    if (!theirs.length) continue;
    const theirVecs = theirs.map(c => SEM.vecs.get(c.key));
    let best = null, strong = 0;
    for (let i = 0; i < mine.length; i++) {
      let bs = -1, bj = 0;
      for (let j = 0; j < theirs.length; j++) {
        const s = semDot(myVecs[i], theirVecs[j]);
        if (s > bs) { bs = s; bj = j; }
      }
      if (bs >= min) strong++;
      if (!best || bs > best.s) best = { s: bs, a: mine[i], b: theirs[bj] };
    }
    if (!best || best.s < min) continue;
    const tags = effectiveTags(n).filter(t => myTags.has(t.toLowerCase()));
    const score = best.s + 0.02 * Math.min(strong - 1, 3) + 0.03 * Math.min(tags.length, 2);
    out.push({ note: n, score, best, tags });
  }
  out.sort((x, y) => y.score - x.score);
  return out;
}

/* vector cache (IndexedDB) */
const SemStore = {
  p: null,
  open() {
    if (!this.p) this.p = new Promise(res => {
      try {
        const r = indexedDB.open('notes-semantic', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('vec');
        r.onsuccess = () => res(r.result);
        r.onerror = r.onblocked = () => res(null);
      } catch (e) { res(null); }
    });
    return this.p;
  },
  async getMany(keys) {
    const out = new Map();
    const db = await this.open();
    if (!db || !keys.length) return out;
    return new Promise(res => {
      try {
        const tx = db.transaction('vec', 'readonly'), st = tx.objectStore('vec');
        keys.forEach(k => { const rq = st.get(k); rq.onsuccess = () => { if (rq.result instanceof Float32Array) out.set(k, rq.result); }; });
        tx.oncomplete = tx.onerror = tx.onabort = () => res(out);
      } catch (e) { res(out); }
    });
  },
  async putMany(map) {
    const db = await this.open();
    if (!db) return;
    try { const tx = db.transaction('vec', 'readwrite'), st = tx.objectStore('vec'); map.forEach((v, k) => st.put(v, k)); } catch (e) {}
  },
  async prune(live) { // drop vectors of text that no longer exists in any note
    const db = await this.open();
    if (!db) return;
    try {
      const tx = db.transaction('vec', 'readwrite'), st = tx.objectStore('vec');
      const rq = st.getAllKeys();
      rq.onsuccess = () => rq.result.forEach(k => { if (!live.has(k)) st.delete(k); });
    } catch (e) {}
  },
  async clear() {
    const db = await this.open();
    if (!db) return;
    try { db.transaction('vec', 'readwrite').objectStore('vec').clear(); } catch (e) {}
  },
};

/* embedding worker */
const SEM_WORKER_SRC = `
import { pipeline, env } from '${SEM.LIB}';
env.allowLocalModels = false;
let extractor = null;
self.onmessage = async (e) => {
  const m = e.data;
  try {
    if (m.type === 'init') {
      extractor = await pipeline('feature-extraction', m.model, {
        dtype: 'q8',
        progress_callback: p => { if (p && p.status === 'progress' && /\\.onnx$/.test(p.file || '')) self.postMessage({ type: 'progress', progress: p.progress }); },
      });
      self.postMessage({ type: 'ready' });
    } else if (m.type === 'embed') {
      const t = await extractor(m.texts, { pooling: 'mean', normalize: true });
      const data = new Float32Array(t.data);
      self.postMessage({ type: 'vecs', id: m.id, dim: t.dims[1], data }, [data.buffer]);
    }
  } catch (err) {
    self.postMessage({ type: 'error', id: m.id, message: String((err && err.message) || err) });
  }
};`;

function semStop(reason) { // terminate the worker and release anything waiting on it
  if (SEM.worker) { SEM.worker.terminate(); SEM.worker = null; }
  const err = new Error(reason || 'stopped');
  SEM.reqs.forEach(r => r.rej(err));
  SEM.reqs.clear();
  if (SEM.readyCtl) { SEM.readyCtl.rej(err); SEM.readyCtl = null; }
  SEM.ready = null;
}

function semFail(msg) {
  console.warn('Semantic similarity unavailable:', msg);
  semStop(msg);
  SEM.state = 'error';
  SEM.error = String(msg || 'unknown error').slice(0, 120);
  semUi();
  if (activeNote) renderRelated(); // falls back to keyword matching
}

function semStart() {
  if (!SEM.enabled || SEM.worker || SEM.state === 'error') return;
  if (typeof Worker === 'undefined' || !window.indexedDB) { semFail('this browser lacks Web Workers or IndexedDB'); return; }
  SEM.state = 'loading'; SEM.progress = 0;
  SEM.ready = new Promise((res, rej) => { SEM.readyCtl = { res, rej }; });
  SEM.ready.catch(() => {}); // rejections are handled by whoever awaits it
  try {
    const url = URL.createObjectURL(new Blob([SEM_WORKER_SRC], { type: 'text/javascript' }));
    SEM.worker = new Worker(url, { type: 'module' });
  } catch (e) { semFail(e.message || e); return; }
  SEM.worker.onmessage = ev => {
    const m = ev.data;
    if (m.type === 'progress') { SEM.progress = Math.round(m.progress || 0); semUi(); }
    else if (m.type === 'ready') { SEM.state = 'ready'; if (SEM.readyCtl) SEM.readyCtl.res(); SEM.readyCtl = null; semUi(); }
    else if (m.type === 'vecs') { const r = SEM.reqs.get(m.id); SEM.reqs.delete(m.id); if (r) r.res(m); }
    else if (m.type === 'error') {
      const r = SEM.reqs.get(m.id);
      if (r) { SEM.reqs.delete(m.id); r.rej(new Error(m.message)); } else semFail(m.message);
    }
  };
  SEM.worker.onerror = ev => semFail(ev.message || 'worker failed to load (offline, or CDN blocked?)');
  SEM.worker.postMessage({ type: 'init', model: SEM.MODEL });
  semUi();
}

function semEmbed(texts) {
  return new Promise((res, rej) => {
    if (!SEM.worker) { rej(new Error('worker not running')); return; }
    const id = ++SEM.reqId;
    SEM.reqs.set(id, { res, rej });
    SEM.worker.postMessage({ type: 'embed', id, texts });
  });
}

// chunk key -> text, for every chunk of every note that has no vector yet (open note first)
function semMissing() {
  const want = new Map();
  const live = semLiveNotes();
  live.sort((a, b) => (b.id === activeNoteId) - (a.id === activeNoteId));
  live.forEach(n => semChunks(n).forEach(c => { if (!SEM.vecs.has(c.key)) want.set(c.key, c.embed); }));
  return want;
}

async function semIndex() {
  if (!SEM.enabled || SEM.state === 'error') return;
  semStart();
  if (SEM.indexing) { SEM.again = true; return SEM.indexing; }
  SEM.indexing = (async () => {
    let worked = false;
    try {
      await SEM.ready;
      do {
        SEM.again = false;
        let want = semMissing();
        if (!want.size) continue;
        worked = true;
        SEM.total = want.size; SEM.done = 0; semUi();
        const cached = await SemStore.getMany([...want.keys()]);
        cached.forEach((v, k) => { SEM.vecs.set(k, v); want.delete(k); });
        const todo = [...want];
        SEM.total = todo.length; SEM.done = 0; semUi();
        for (let i = 0; i < todo.length; i += SEM.BATCH) {
          const batch = todo.slice(i, i + SEM.BATCH);
          const { dim, data } = await semEmbed(batch.map(e => e[1]));
          const fresh = new Map();
          batch.forEach((e, j) => { const v = data.slice(j * dim, (j + 1) * dim); SEM.vecs.set(e[0], v); fresh.set(e[0], v); });
          SemStore.putMany(fresh);
          SEM.done += batch.length; semUi();
        }
      } while (SEM.again);
      if (!SEM.pruned && notes.length) { // once per session: forget vectors for text that no longer exists
        SEM.pruned = true;
        const liveKeys = new Set(), liveIds = new Set();
        semLiveNotes().forEach(n => { liveIds.add(n.id); semChunks(n).forEach(c => liveKeys.add(c.key)); });
        SemStore.prune(liveKeys);
        SEM.vecs.forEach((v, k) => { if (!liveKeys.has(k)) SEM.vecs.delete(k); });
        SEM.chunkCache.forEach((v, id) => { if (!liveIds.has(id)) SEM.chunkCache.delete(id); });
      }
    } catch (e) {
      if (SEM.enabled && SEM.state !== 'error') semFail(e.message || e);
      worked = false;
    } finally {
      SEM.indexing = null;
      SEM.done = SEM.total = 0;
      semUi();
      if (worked && activeNote) renderRelated();
    }
  })();
  return SEM.indexing;
}

// Debounced: index whatever has no vector yet (new notes, edited bullets)
function semSchedule() {
  if (!SEM.enabled || SEM.state === 'error' || !notes.length) return;
  clearTimeout(SEM.timer);
  SEM.timer = setTimeout(() => { if (SEM.state === 'idle' || SEM.indexing || semMissing().size) semIndex(); }, 400);
}

function semReset() { // on sign-out: drop every vector derived from the previous user's notes
  SEM.vecs.clear(); SEM.chunkCache.clear(); SEM.pruned = false;
  SemStore.clear();
}

function toggleSemantic() {
  SEM.enabled = !SEM.enabled;
  lsSet('notes-semantic', SEM.enabled ? '1' : '0');
  if (SEM.enabled) { if (SEM.state === 'error') SEM.state = 'idle'; semSchedule(); }
  else { semStop('turned off'); SEM.state = 'idle'; }
  semUi();
  if (activeNote) renderRelated();
}

function semUi() {
  const item = document.getElementById('sem-item');
  if (item) {
    item.setAttribute('aria-checked', String(SEM.enabled));
    const sub = !SEM.enabled ? 'Keyword matching only' : SEM.state === 'error' ? 'Unavailable — using keywords'
      : SEM.state === 'loading' ? 'Loading model' + (SEM.progress ? ` · ${SEM.progress}%` : '…')
      : SEM.indexing && SEM.total ? `Indexing ${SEM.done}/${SEM.total}` : 'Matches by meaning, on this device';
    document.getElementById('sem-sub').textContent = sub;
  }
  const el = document.getElementById('rel-sem');
  if (!el) return;
  let t = '';
  if (!SEM.enabled) t = 'Similar notes use keyword matching. Turn on semantic matching in Settings.';
  else if (SEM.state === 'error') t = `Semantic matching unavailable (${SEM.error}). Using keyword matching.`;
  else if (SEM.state === 'loading') t = 'Loading semantic model' + (SEM.progress ? ` · ${SEM.progress}%` : '…') + ' Using keyword matching meanwhile.';
  else if (SEM.indexing && SEM.total) t = `Indexing notes · ${SEM.done}/${SEM.total}`;
  else if (SEM.state === 'ready') t = 'Similar notes are matched by meaning, on this device.';
  el.textContent = t;
}

function computeRelated() {
  const me = { id: activeNoteId, ...activeNote };
  const others = notes.filter(n => n.id !== activeNoteId);
  const uniq = a => [...new Set(a.filter(Boolean).map(s => s.trim()).filter(Boolean))];

  // 1. backlinks: other notes containing [[this note]] under any name it has gone by
  const mine = titleLine(me.content);
  const linkNames = uniq([mine.text, mine.full, me.title]);
  const backlinks = [];
  if (linkNames.length) {
    const re = new RegExp('\\[\\[\\s*(?:' + linkNames.map(escapeRegex).join('|') + ')\\s*\\]\\]', 'i');
    others.forEach(n => {
      const m = re.exec(n.content || '');
      if (m) backlinks.push({ note: n, html: contextSnippet(n.content, m.index, m[0].length) });
    });
  }
  const linked = new Set(backlinks.map(b => b.note.id));

  // 2. unlinked mentions: the title appears as plain text, outside any [[ ]]
  const mentionNames = uniq([mine.text]).filter(s => s.length >= 3 && s.length <= 60);
  const mentions = [];
  if (mentionNames.length) {
    const re = new RegExp('(?<![\\p{L}\\p{N}])(?:' + mentionNames.map(escapeRegex).join('|') + ')(?![\\p{L}\\p{N}])', 'iu');
    others.forEach(n => {
      if (linked.has(n.id)) return;
      const text = (n.content || '').replace(/\[\[[^\]]*\]\]/g, m => ' '.repeat(m.length)); // same length so indexes still line up
      const m = re.exec(text);
      if (m) mentions.push({ note: n, html: contextSnippet(n.content, m.index, m[0].length) });
    });
  }
  const mentioned = new Set(mentions.map(m => m.note.id));

  // 3. similar: by meaning (best matching chunk) once the embedding model is ready,
  //    otherwise shared tags (weighted) + shared keywords
  if (SEM.enabled && SEM.state === 'ready') {
    const similar = semSimilar(me, others, new Set([...linked, ...mentioned]));
    return { backlinks, mentions, similar: similar.slice(0, 6), semantic: true };
  }
  const myWords = keywordSet(me);
  const myTags = new Set(effectiveTags(me).map(t => t.toLowerCase()));
  const similar = [];
  others.forEach(n => {
    if (linked.has(n.id) || mentioned.has(n.id)) return;
    const tags = effectiveTags(n).filter(t => myTags.has(t.toLowerCase()));
    const words = [...keywordSet(n)].filter(w => myWords.has(w));
    const score = tags.length * 3 + words.length;
    if (score >= 3) similar.push({ note: n, score, tags, words });
  });
  similar.sort((a, b) => b.score - a.score);
  return { backlinks, mentions, similar: similar.slice(0, 6), semantic: false };
}

function renderRelated() {
  if (!activeNote) { setRelatedState(false, 0); return; }
  let rel;
  try { rel = computeRelated(); } catch (err) {
    console.error('computeRelated failed:', err);
    rel = { backlinks: [], mentions: [], similar: [], semantic: false, failed: true };
  }
  const { backlinks, mentions, similar, semantic } = rel;
  try { semSchedule(); } catch (err) { console.error('semSchedule failed:', err); } // embed any new / edited chunks, then this panel re-renders
  const body = document.getElementById('related-body');
  const openState = {};
  body.querySelectorAll('details[data-k]').forEach(d => { openState[d.dataset.k] = d.open; }); // keep user's collapsed sections
  body.innerHTML = '';
  const section = (key, label, entries) => {
    if (!entries.length) return;
    const d = document.createElement('details');
    d.className = 'rel-section';
    d.dataset.k = key;
    d.open = openState[key] !== false;
    d.innerHTML = `<summary>${label} <span class="n">${entries.length}</span></summary>`;
    entries.forEach(e => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'rel-item';
      b.innerHTML = `<span class="t">${escapeHtml(displayTitle(e.note))}</span><span class="s">${e.html}</span>` + (e.meta ? `<span class="m">${escapeHtml(e.meta)}</span>` : '');
      b.onclick = () => openNote(e.note.id);
      d.appendChild(b);
    });
    body.appendChild(d);
  };
  section('back', 'Backlinks', backlinks);
  section('unlinked', 'Unlinked mentions', mentions);
  const clip = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
  section('similar', 'Similar notes', similar.map(s => semantic ? ({
    note: s.note,
    html: escapeHtml(clip(s.best.b.text, 130)),   // the chunk that matched
    meta: `↔ “${clip(s.best.a.text, 60)}” · ${Math.round(s.best.s * 100)}%` + (s.tags.length ? ' · ' + s.tags.map(t => '#' + t).join(' ') : ''),
  }) : ({
    note: s.note,
    html: escapeHtml(bodySnippet(s.note, 110)) || '<i>No body text</i>',
    meta: 'Shared: ' + [...s.tags.map(t => '#' + t), ...s.words.slice(0, 4)].join(', '),
  })));
  const total = backlinks.length + mentions.length + similar.length;
  if (!total) body.innerHTML = rel.failed
    ? '<div class="rel-empty">Couldn\'t work out related notes for this note (details in the browser console).</div>'
    : '<div class="rel-empty">Nothing related yet. Backlinks, unlinked mentions and similar notes show up here as you write.</div>';
  setRelatedState(true, total);
}

function setRelatedState(show, count) { // show: a note is open (the panel is shown even when it has nothing to list)
  relatedAvailable = show;
  const pane = document.getElementById('related-pane');

}

// Tab / Shift+Tab indent and outdent (2 spaces); Enter continues bullet, numbered and task lists
function onEditorKeydown(e) {
  if (picker) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const n = picker.items.length;
      picker.hi = (picker.hi + (e.key === 'ArrowDown' ? 1 : n - 1)) % n;
      renderLinkPicker(e.target, e.target.selectionStart);
      return;
    }
    if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); pickLink(picker.items[picker.hi]); return; }
    if (e.key === 'Escape') { e.preventDefault(); closeLinkPicker(); return; }
  }
  const ta = e.target;
  const v = ta.value;
  const ss = ta.selectionStart, se = ta.selectionEnd;
  const lineStart = v.lastIndexOf('\n', ss - 1) + 1;

  if (e.key === 'Tab') {
    e.preventDefault();
    let blockEnd = v.indexOf('\n', se);
    if (blockEnd === -1) blockEnd = v.length;
    if (ss === se && !e.shiftKey) { ta.setRangeText('  ', ss, se, 'end'); return editorChanged(ta); }
    const block = v.slice(lineStart, blockEnd);
    const out = block.split('\n').map(l => e.shiftKey ? l.replace(/^( {1,2}|\t)/, '') : '  ' + l).join('\n');
    ta.setRangeText(out, lineStart, blockEnd, 'select');
    return editorChanged(ta);
  }

  if (e.key === 'Enter' && !e.shiftKey && !e.metaKey && !e.ctrlKey && ss === se) {
    const line = v.slice(lineStart, ss);
    const m = line.match(/^(\s*)([-*+]|\d+[.)])(\s+)(\[[ xX]\]\s+)?(.*)$/);
    if (!m) return;
    e.preventDefault();
    const [, indent, marker, gap, task, text] = m;
    if (!text.trim()) { // empty item: end the list
      ta.setRangeText('', lineStart, ss, 'end');
      return editorChanged(ta);
    }
    const next = /\d/.test(marker) ? (parseInt(marker, 10) + 1) + marker.slice(-1) : marker;
    ta.setRangeText('\n' + indent + next + gap + (task ? '[ ] ' : ''), ss, se, 'end');
    editorChanged(ta);
  }
}

function onEditorPaste(e) {
  const item = [...(e.clipboardData.items || [])].find(i => i.type.startsWith('image/'));
  if (item) { e.preventDefault(); uploadImage(item.getAsFile()); return; }
  const html = e.clipboardData.getData('text/html');
  if (!html || typeof TurndownService === 'undefined') return;
  const md = htmlToMarkdown(html);
  if (md === null) return; // no rich formatting: let the browser paste plain text
  e.preventDefault();
  const ta = e.target;
  const [s, end] = [ta.selectionStart, ta.selectionEnd];
  ta.setRangeText(md, s, end, 'end');
  activeNote.content = ta.value;
  renderPreview();
  scheduleSave();
}
let turndown;
function htmlToMarkdown(html) {
  if (!/<(h[1-6]|strong|b|em|i|ul|ol|li|a|blockquote|pre|code|table|img)\b/i.test(html)) return null;
  if (!turndown) {
    turndown = new TurndownService({ headingStyle: 'atx', bulletListMarker: '-', codeBlockStyle: 'fenced', emDelimiter: '*' });
    turndown.remove(['style', 'script', 'meta']);
    if (typeof turndownPluginGfm !== 'undefined') turndown.use(turndownPluginGfm.gfm);
  }
  const doc = new DOMParser().parseFromString(DOMPurify.sanitize(html), 'text/html');
  // Word/Google Docs wrap content in <b style="font-weight:normal"> — don't treat as bold
  doc.querySelectorAll('b[style*="font-weight:normal"], b[id^="docs-internal-guid"]').forEach(b => b.replaceWith(...b.childNodes));
  // Sheets/Excel/Word tables often lack a header row, which GFM tables require: promote the first row
  doc.querySelectorAll('table').forEach(t => {
    if (t.querySelector('th')) return;
    const row = t.querySelector('tr');
    if (!row) return;
    [...row.children].forEach(td => {
      const th = doc.createElement('th');
      th.append(...td.childNodes);
      td.replaceWith(th);
    });
  });
  return turndown.turndown(doc.body).trim();
}
async function uploadImage(file) {
  if (!activeNoteId || !currentUser) return;
  toast('Uploading image...');
  const path = `users/${currentUser.uid}/notes/${activeNoteId}/${Date.now()}_${file.name}`;
  const ref = storage.ref(path);
  await ref.put(file);
  const url = await ref.getDownloadURL();
  const ta = document.getElementById('md-input');
  const pos = ta.selectionStart;
  const insert = `\n![](${url})\n`;
  ta.value = ta.value.slice(0, pos) + insert + ta.value.slice(pos);
  activeNote.content = ta.value;
  renderPreview();
  scheduleSave();
  toast('Image added');
}

(function initSidebarResizer() {
  const h = document.getElementById('sidebar-resizer');
  const MIN = 200, MAX = 480, DEF = 260;
  const setW = (w, persist) => {
    w = Math.max(MIN, Math.min(MAX, Math.round(w)));
    document.documentElement.style.setProperty('--sidebar-w', w + 'px');
    h.setAttribute('aria-valuenow', w);

  let w = parseInt(lsGet('notes-sidebar-w'), 10);
  w = setW(w || DEF, false);
  let dragging = false;
  h.addEventListener('pointerdown', e => { dragging = true; h.setPointerCapture(e.pointerId); document.body.classList.add('resizing'); });
  h.addEventListener('pointermove', e => { if (dragging) w = setW(e.clientX, false); });
  const end = () => { if (!dragging) return; dragging = false; document.body.classList.remove('resizing'); setW(w, true); };
  h.addEventListener('pointerup', end);
  h.addEventListener('pointercancel', end);
  h.addEventListener('dblclick', () => { w = setW(DEF, true); });
  h.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') { e.preventDefault(); w = setW(w - 16, true); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); w = setW(w + 16, true); }
  });
})();

/* ---------- boot ---------- */

(function boot() {
  document.getElementById('search').value = '';
  const params = new URLSearchParams(location.search);
  const u = params.get('u'), n = params.get('n');
  if (u && n) {
    initReadOnlyView(u, n);
  } else {
    document.getElementById('app').hidden = false;
    renderAccount(null);
    applyTheme(document.documentElement.getAttribute('data-theme'));
  }
})();
</script>
